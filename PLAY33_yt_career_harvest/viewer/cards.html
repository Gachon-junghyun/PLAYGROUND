rounded follow-up"}, "axis": "rebuttal_judo", "move": "Contrast-the-airtime tell: point out the opponent said 'yes' to Hamas being bad in one second, then spent 99% of his time justifying it — vs his own ratio.", "who": "Rudy Rockman", "how_it_works": "Quantifies the asymmetry in how each side condemns its own bad actors, turning a vague impression into a concrete prosecutorial point about good faith.", "evidence_quote": "when Ahmed was asked if Hamas is a bad actor, he said yes very quickly and then focused almost 99% of the time on justifying Hamas. When I was asked about extremist Israelis, I spent the majority of the time condemning them", "counter": "Reframe justification as causation, not endorsement — Ahmed: Hamas is 'a natural outcome of decades of oppression... explaining is not justifying,' and demand symmetric scrutiny of Israeli state actors.", "effectiveness": "won — the host echoes the point, pressing Ahmed to be 'more surgical' in criticizing Hamas", "confidence": "high", "corpus": "EN", "corpus_label": "영어 실시간 토론", "_channel": "Jubilee", "_title": "Israeli vs Palestinian Surrounded follow-up", "_vid": "sb220gRDiBE", "move_ko": "발언 시간 대비를 폭로한다: 상대는 하마스가 나쁘다고 1초만 '예' 하고 99% 시간을 정당화에 썼다 vs 자기 비율을 지적한다.", "how_ko": "각 진영이 자기편 악행을 비난하는 비대칭을 정량화해, 막연한 인상을 선의 여부에 관한 구체적 기소 논점으로 전환한다.", "counter_ko": "정당화를 지지가 아닌 인과로 재프레이밍하라 — Ahmed: 하마스는 '수십 년 억압의 자연스러운 결과... 설명은 정당화가 아니다.' 그리고 이스라엘 국가 행위자에 대한 대칭적 검증을 요구하라.", "quote_gloss_ko": "'Ahmed는 1초만 인정, 99%는 하마스 정당화'"}, {"card_id": "E511", "source_video": {"video_id": "sb220gRDiBE", "channel": "Jubilee", "title_hint": "Israeli vs Palestinian Surrounded follow-up"}, "axis": "escape_route", "move": "Redefine-to-dodge: when pressed that the Holy Land claims are religious, repeatedly reclassify Judaism as 'a civilization, not a religion' to escape the secular-state objection.", "who": "Rudy Rockman", "how_it_works": "By denying the religion label he sidesteps the 'a Jewish state can't be democratic/secular' attack and th ean resolution", "confidence": "medium — heavily edited, both talk over each other", "corpus": "EN", "corpus_label": "영어 실시간 토론", "_channel": "Dean Withers", "_title": "MAGA Man LIES About Needing ChatGPT In A Debate", "_vid": "1dEb0nx53DY", "move_ko": "기시 갤럽(말 폭탄)을 명명: '나를 압도하려고 여러 논점을 한꺼번에 던지니, 하나씩 가겠다'", "how_ko": "빠른 다중 주장 쏟아내기에 명시적으로 이름표를 붙이고 순차 반박 방식을 선언해, 상대가 양으로 숨을 가림막을 빼앗는다.", "counter_ko": "그가 실제로 모든 논점을 끝내게 강제하거나, 하나씩 가는 것이 네게 재정비 기회를 줌을 받아들여라. 각 논점에서 시간 끌지 못하게 하라.", "quote_gloss_ko": "날 압도하려 논점을 한꺼번에 던지는데 하나씩 답하겠다"}, {"card_id": "E605", "source_video": {"video_id": "1dEb0nx53DY", "channel": "Dean Withers", "title_hint": "MAGA Man LIES About Needing ChatGPT In A Debate"}, "axis": "frame_control", "move": "Force a definitional distinction: 'recovery is not growth' to deny the pandemic-rebound defense", "who": "Dean", "how_it_works": "Controls the battleground by defining the rebound window narrowly (down to pre-pandemic level only), so post-2021 growth can't be attributed to recovery.", "evidence_quote": "Recovery is not growth, okay? Recovery is rebound.", "counter": "Opponent's 'until the next dip' redefinition is weak; a stronger counter cites that potential-output gaps can persist past nominal recovery.", "effectiveness": "won on the definitional point — opponent ends conceding the 50-year-recovery absurdity", "confidence": "medium — long, noisy, edited pro-Dean", "corpus": "EN", "corpus_label": "영어 실시간 토론", "_channel": "Dean Withers", "_title": "MAGA Man LIES About Needing ChatGPT In A Debate", "_vid": "1dEb0nx53DY", "move_ko": "정의적 구분을 강제: '회복은 성장이 아니다'로 팬데믹 반등 방어를 차단", "how_ko": "반등 구간을 좁게(팬데믹 이전 수준까지만) 정의해 전장을 통제하므로, 2021년 이후 성장은 회복으로 귀속될 수 없다.", "counter_ko": "상대의 '다음 침체까지' 재정의는 약하다. 더 강한 반박은 잠재산출 격차가 명목상 회복 이후에도 지속될 수 있음을 인용하는 것.", "quote_gloss_ko": "회복은 성장이 아니다, 회복은 반등일 뿐이다"}, {"card_id": "E606", "source_video": {"video_id": "1dEb0nx53DY", "channel": "Dean Withers", "title_hint": "MAGA Man LIES About Needing ChatGPT In A Debate"}, "axis": "escap ives, only 'less rape', which Dean rebutted with ICE data", "confidence": "high", "corpus": "EN", "corpus_label": "영어 실시간 토론", "_channel": "Dean Withers", "_title": "MAGA Man Offers $33,000 If He LOSES THIS DEBATE", "_vid": "Im4dn1BJ8Bs", "move_ko": "적용 전에 추상 전제를 못박는다: '장점 0, 단점만 있는 정책은 나쁘다는 데 동의하나?'", "how_ko": "먼저 일반 원칙 동의를 확보한 뒤 상대에게 대규모 추방의 정량적 긍정 효과를 나열하라 요구한다. 함정을 미리 깔아둔 것.", "counter_ko": "추상적 설정을 '유도 질문'으로 거부하거나, 모호한 주장 대신 구체적·출처 있는 장점을 제시하라.", "quote_gloss_ko": "긍정 결과 0, 부정만 있는 정책은 나쁘다 동의하나, 추방 장점 나열해봐라"}, {"card_id": "E608", "source_video": {"video_id": "Im4dn1BJ8Bs", "channel": "Dean Withers", "title_hint": "MAGA Man Offers $33,000 If He LOSES THIS DEBATE"}, "axis": "rebuttal_judo", "move": "Accept the 'less rape' frame, then invert it with ICE arrest data showing fewer convicted criminals deported under Trump", "who": "Dean / Parker", "how_it_works": "Takes opponent's own goal (less rape) and shows mass deportation widens scope away from convicted offenders, so it produces MORE risk by his own metric.", "evidence_quote": "2024 under Biden, 58,000 undocumented immigrants with bad criminal convictions on their records were deported. 2025 under Trump, 15,000.", "counter": "Argue total deportation volume still removes more offenders in absolute terms, or contest the ICE-stat framing of 'focus'.", "effectiveness": "won — opponent conceded the 58k>15k point ('that's just pure luck')", "confidence": "high", "corpus": "EN", "corpus_label": "영어 실시간 토론", "_channel": "Dean Withers", "_title": "MAGA Man Offers $33,000 If He LOSES THIS DEBATE", "_vid": "Im4dn1BJ8Bs", "move_ko": "'강간 감소' 프레임을 받아들인 뒤, 트럼프 하에서 유죄 범죄자 추방이 더 적다는 ICE 체포 데이터로 뒤집는다", "how_ko": "상대 자신의 목표(강간 감소)를 취해, 대규모 추방이 유죄 범죄자에서 범위를 넓혀버려 그 자신의 지표로 보면 더 큰 위험을 낳음을 보인다.", "counter_ko": "전체 추방량이 절대 수치로는 여전히 더 많은 범죄자를 제거한다 주장하거나, '초점'이라는 ICE 통계 틀을 반박하라.", "quote_gloss_ko": "바이든 2024년 범죄자 추방 5.8만, 트럼프 2025년 1.5만"}, {"card_id": "E609", "source_video": {"video_id": "Im4dn1BJ8Bs", "channel": "Dean Withers", "titl nes.", "evidence_quote": "do you want to go by biology or do you want to go like with religion... there are three answers you only have to say one two or three", "counter": "Refuse the forced trichotomy as a false menu; the categories overlap (a biological definition can use Latin etymology).", "effectiveness": "neutral — control attempt but the exchange stays chaotic; framed as an 'own' by editing", "confidence": "medium — single speaker hard to separate, heated", "corpus": "EN", "corpus_label": "영어 실시간 토론", "_channel": "Turning Point USA", "_title": "She Tries to Defend Abortion... Then the Argument Starts Falling Apart", "_vid": "dJMWlE-GZKc", "move_ko": "TPUSA 대표가 단어 하나 분류를 강제: '이건 생물학, 라틴어, 기독교 중 뭔가? 1, 2, 3으로 답해'", "how_ko": "상대가 하나의 프레임을 고르게 만들어 전장을 장악하려 한다. 그녀가 정의적·과학적 노선을 섞지 못하게 막는다.", "counter_ko": "강제된 삼분법을 거짓 메뉴로 거부하라. 범주들은 겹친다(생물학적 정의가 라틴어 어원을 쓸 수 있다).", "quote_gloss_ko": "생물학으로 갈래 종교로 갈래, 답은 셋뿐 1·2·3 중 하나만 말해"}, {"card_id": "E614", "source_video": {"video_id": "dJMWlE-GZKc", "channel": "Turning Point USA", "title_hint": "She Tries to Defend Abortion... Then the Argument Starts Falling Apart"}, "axis": "rebuttal_judo", "move": "Pro-choice rep distinguishes ectopic-pregnancy/medical necessity from elective abortion to block the equivocation", "who": "Pro-choice woman", "how_it_works": "Reframes 'abortion ban' to surface its non-elective medical cases (ectopic, no-skull fetus) the ban would also criminalize.", "evidence_quote": "when you ban abortions that includes medical necessity abortions... a baby can't survive in that.", "counter": "TPUSA rep separates the two: 'an abortion is an elective procedure... you cannot equate the two, that is disingenuous.'", "effectiveness": "neutral — clip framed as her 'falling apart', but the medical-necessity point is substantively unrebutted on the merits", "confidence": "medium — editing strongly favors TPUSA", "corpus": "EN", "corpus_label": "영어 실시간 토론", "_channel": "Turning Point USA", "_title": "She Tries to Defend Abortion... Then the Argument Starts Falling Apart", "_vid": "dJMWlE-GZKc", "move_ko": "낙태 찬성 대표가 자궁외임신/의학적 필요와 선택적 낙태를 구분해 동어반복적 혼동을 차단", "how_ko": "'낙태 금지'를 재구성해, 금지가 함께 범죄화할 비선택적 의료 사례(자궁외임신, 두개골 없는 태아)를 드러낸다.", "counter_ko": "TPUSA 대표는 둘을 분리한다: '낙태는 선택적 시술... 둘을 동일시할 수 없다, 그건 기만적이다.'", "quote_gloss_ko": "낙태 금지엔 의학적 필요 낙태도 포함된다, 그 태아는 생존 못한다"}, {"card_id": "E615", "source_video": {"video_id": "ML4yCKAI5pU", "channel": "Turning Point USA", "title_hint": "Student Argues Unborn Life Has No Rights Without Consciousness"}, "axis": "frame_control", "move": "Student reframes personhood from 'life begins at conception' to 'capacity to deploy conscious experience'", "who": "Student (pro-choice)", "how_it_works": "Shifts the criterion from biological life to consciousness, using the symmetry with brain-death definitions to justify the new battleground.", "evidence_quote": "the capacity to deploy a conscious experience is more of an apt way to give personhood... we mark that person's death when they are no longer able to deploy conscious experience.", "counter": "TPUSA's acorn/cake counter ('a human cell is always going to develop into a human') attacks the potential vs actual line.", "effectiveness": "neutral — coherent reframe but TPUSA's burning-hospital hypo pressures it; civil exchange, no clean own", "confidence": "high", "corpus": "EN", "corpus_label": "영어 실시간 토론", "_channel": "Turning Point USA", "_title": "Student Argues Unborn Life Has No Rights Without Consciousness", "_vid": "ML4yCKAI5pU", "move_ko": "학생이 인격을 '수정 시 생명 시작'에서 '의식적 경험을 발휘할 능력'으로 재구성", "how_ko": "기준을 생물학적 생명에서 의식으로 옮기고, 뇌사 정의와의 대칭성을 써서 새 전장을 정당화한다.", "counter_ko": "TPUSA의 도토리/케이크 반박('인간 세포는 항상 인간으로 발달한다')은 잠재 대 현실의 경계를 공격한다.", "quote_gloss_ko": "의식적 경험 발휘 능력이 인격 부여에 더 맞다, 죽음도 그 능력 상실로 표시"}, {"card_id": "E616", "source_video": {"video_id": "ML4yCKAI5pU", "channel": "Turning Point USA", "title_hint": "Student Argues Unborn Life Has No Rights Without Consciousness"}, "axis": "fallacy_trap", "move": function fillSelect(id, values){
  const sel=document.getElementById(id);
  values.forEach(v=>{ const o=document.createElement("option"); o.value=v; o.textContent=v; sel.appendChild(o); });
}
fillSelect("corpus", [...new Set(CARDS.map(c=>c.corpus_label))]);
fillSelect("axis", [...new Set(CARDS.map(c=>c.axis))].sort());
fillSelect("channel", [...new Set(CARDS.map(c=>c._channel))].sort());

let LANG = "ko";   // EN 카드만 영향: 한글 번역 ↔ 원문
function cardHtml(c){
  const col = axisColor[c.axis] || "#5b9dff";
  const ec = effClass(c.effectiveness);
  const KO = LANG==="ko", hasKo = !!c.move_ko;
  const move    = (KO && hasKo) ? c.move_ko    : c.move;
  const how     = (KO && hasKo) ? c.how_ko     : c.how_it_works;
  const counter = (KO && hasKo) ? c.counter_ko : c.counter;
  const gloss   = (KO && c.quote_gloss_ko) ? c.quote_gloss_ko : "";
  const vid = c._vid ? `<a class="vid" href="https://www.youtube.com/watch?v=${encodeURIComponent(c._vid)}" target="_blank" rel="noopener">▶ 원본</a>` : "";
  let foot = `<span class="corpus">${esc(c.corpus)}</span>`;
  if(c.effectiveness) foot += `<span class="chip eff-${ec||'neutral'}">${esc((c.effectiveness||'').split(/[—-]/)[0].trim())}</span>`;
  if(Array.isArray(c.applies_to)) c.applies_to.forEach(a=>foot+=`<span class="tag">${esc(a)}</span>`);
  if(c.confidence) foot += `<span class="tag">conf: ${esc((c.confidence||'').split(/[—-]/)[0].trim())}</span>`;
  foot += vid;
  return `<div class="card">
    <div class="card-top">
      <span class="cid">${esc(c.card_id)}</span>
      <span class="chip" style="background:${col}22;color:${col}">${esc(c.axis)}</span>
    </div>
    <div class="move">${esc(move)}</div>
    ${c.who?`<div class="who">👤 ${esc(c.who)}</div>`:""}
    <div class="how">${esc(how)}</div>
    <div class="quote">“${esc(c.evidence_quote)}”${gloss?`<div class="gloss">↳ ${esc(gloss)}</div>`:""}</div>
    ${counter?`<div class="counter"><b>🛡 막는 법</b> · ${esc(counter)}</div>`:""}
    <div style="font-size:11.5px;color:var(--muted)">${esc(c._channel)}${c._title?" · "+esc(c._title):""}</div>
    <div class="foot">${foot}</div>
  </div>`;
}

const grid=document.getElementById("grid"), stats=document.getElementById("stats");
function render(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const fc=document.getElementById("corpus").value, fa=document.getElementById("axis").value,
        fch=document.getElementById("channel").value, fe=document.getElementById("eff").value;
  const rows=CARDS.filter(c=>{
    if(fc && c.corpus_label!==fc) return false;
    if(fa && c.axis!==fa) return false;
    if(fch && c._channel!==fch) return false;
    if(fe && effClass(c.effectiveness)!==fe) return false;
    if(q){
      const hay=[c.card_id,c.axis,c.move,c.how_it_works,c.evidence_quote,c.counter,c._channel,c._title,c.who,(c.applies_to||[]).join(" "),c.move_ko,c.how_ko,c.counter_ko,c.quote_gloss_ko].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  grid.innerHTML = rows.length ? rows.map(cardHtml).join("") : `<div class="empty">조건에 맞는 카드가 없어요.</div>`;
  stats.textContent = `${rows.length} / ${CARDS.length}개`;
}
["q","corpus","axis","channel","eff"].forEach(id=>{
  document.getElementById(id).addEventListener("input",render);
  document.getElementById(id).addEventListener("change",render);
});
document.getElementById("lang").addEventListener("click",()=>{
  LANG = LANG==="ko" ? "en" : "ko";
  document.getElementById("lang").textContent = LANG==="ko" ? "🇰🇷 한글" : "🇬🇧 원문";
  render();
});
render();
</script>
</body>
</html>
