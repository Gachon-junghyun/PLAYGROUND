<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Block Writer</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; color: #1a1a1a; background: #f5f5f4; }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #1f1f1f; color: #f5f5f4; flex-shrink: 0; }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0.4px; }
  header .sep { flex: 1; }
  header button { background: #2e2e2e; color: #f5f5f4; border: 1px solid #3a3a3a; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  header button:hover { background: #3a3a3a; }
  header .status { font-size: 11px; color: #9a9a9a; margin-right: 6px; }

  /* Document selector */
  #doc-selector { position: relative; }
  #doc-current-btn {
    background: #2e2e2e; color: #f5f5f4; border: 1px solid #3a3a3a;
    padding: 5px 10px 5px 12px; border-radius: 4px; font-size: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; max-width: 360px;
  }
  #doc-current-btn:hover { background: #3a3a3a; }
  #doc-current-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
  #doc-current-btn .caret { color: #9a9a9a; font-size: 10px; }
  #doc-menu {
    position: absolute; top: 100%; left: 0; margin-top: 4px;
    background: #fff; color: #1a1a1a; border: 1px solid #d6d3d1; border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    min-width: 320px; max-width: 480px; max-height: 60vh; overflow-y: auto;
    z-index: 300; padding: 4px;
  }
  #doc-menu[hidden] { display: none; }
  .doc-item-row {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  .doc-item-row:hover { background: #f5f5f4; }
  .doc-item-row.current { background: #ecfeff; color: #0c4a6e; font-weight: 600; }
  .doc-item-row .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-item-row .meta-id { font-size: 10px; color: #a8a29e; font-family: ui-monospace, monospace; }
  .doc-item-row .actions { display: none; gap: 4px; }
  .doc-item-row:hover .actions { display: flex; }
  .doc-item-row .actions button {
    background: transparent; border: none; padding: 2px 6px; cursor: pointer;
    font-size: 11px; color: #78716c; border-radius: 3px;
  }
  .doc-item-row .actions button:hover { background: #e7e5e4; color: #1a1a1a; }
  .doc-item-row .actions button.danger:hover { background: #fef2f2; color: #b91c1c; }
  #doc-menu .divider { height: 1px; background: #e7e5e4; margin: 4px 2px; }
  #doc-menu .new-doc-btn {
    width: 100%; text-align: left;
    background: transparent; border: none; padding: 6px 8px; cursor: pointer;
    font-size: 13px; color: #0ea5e9; font-weight: 600; border-radius: 4px;
  }
  #doc-menu .new-doc-btn:hover { background: #ecfeff; }

  main { flex: 1; display: flex; min-height: 0; }
  #canvas-pane { flex: 1; overflow-y: auto; padding: 36px 56px; background: #fafaf9; min-width: 0; }
  #splitter { width: 6px; flex-shrink: 0; cursor: col-resize; background: transparent; border-left: 1px solid #d6d3d1; transition: background 0.15s; }
  #splitter:hover, #splitter.dragging { background: #0ea5e9; border-color: #0ea5e9; }
  body.resizing { user-select: none; cursor: col-resize; }
  body.resizing * { cursor: col-resize !important; }
  #scratch-pane { width: 360px; flex-shrink: 0; background: #f5f5f4; display: flex; flex-direction: column; min-width: 220px; }

  /* Canvas */
  #canvas { max-width: 720px; margin: 0 auto; }
  #canvas-title { font-size: 30px; font-weight: 700; outline: none; padding: 4px 0; margin-bottom: 16px; }
  #canvas-title:empty::before { content: "제목 없음"; color: #bbb; }
  .doc-item { margin: 8px 0; position: relative; }
  .doc-item.drag-over-top::before, .doc-item.drag-over-bottom::after {
    content: ""; position: absolute; left: 0; right: 0; height: 2px; background: #0ea5e9;
  }
  .doc-item.drag-over-top::before { top: -5px; }
  .doc-item.drag-over-bottom::after { bottom: -5px; }
  .doc-para { outline: none; line-height: 1.7; font-size: 16px; padding: 2px 0; min-height: 1.7em; }
  .doc-para:empty::before { content: "여기에 쓰거나 오른쪽 블럭을 끌어와…"; color: #ccc; }
  .doc-section { font-size: 20px; font-weight: 700; padding: 14px 12px 10px; margin: 18px 0 6px; border-left: 3px solid #0ea5e9; background: #ecfeff; color: #0c4a6e; border-radius: 0 4px 4px 0; outline: none; }
  .doc-section .label { font-size: 10px; letter-spacing: 1.2px; color: #0891b2; text-transform: uppercase; display: block; margin-bottom: 2px; }
  .doc-card { padding: 12px 14px; border: 1px solid #d6d3d1; background: #fff; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); transition: box-shadow 0.15s, border-color 0.15s; }
  .doc-card:focus-within { border-color: #0ea5e9; box-shadow: 0 0 0 2px #0ea5e9, 0 4px 12px rgba(14,165,233,0.12); }
  .doc-card .card-head { font-size: 11px; color: #78716c; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.6px; }
  .doc-card .card-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; outline: none; }
  .doc-card .card-title:empty::before { content: attr(data-placeholder); color: #ccc; }
  .doc-card .card-body { font-size: 14px; color: #44403c; line-height: 1.55; white-space: pre-wrap; outline: none; }
  .doc-card .card-body:empty::before { content: attr(data-placeholder); color: #ccc; }
  .doc-text { line-height: 1.7; font-size: 16px; padding: 6px 0; border-left: 3px solid #e7e5e4; padding-left: 12px; outline: none; }
  .doc-text .src { font-size: 10px; color: #a8a29e; display: block; margin-top: 3px; }

  .doc-item .controls { position: absolute; right: -40px; top: 4px; display: none; flex-direction: column; gap: 2px; }
  .doc-item:hover .controls { display: flex; }
  .doc-item .controls button { background: #fff; border: 1px solid #d6d3d1; padding: 2px 6px; font-size: 11px; border-radius: 3px; cursor: pointer; color: #57534e; }
  .doc-item .controls button:hover { background: #f5f5f4; }

  /* Scratch */
  #scratch-head { padding: 10px 14px; border-bottom: 1px solid #d6d3d1; display: flex; gap: 6px; flex-shrink: 0; }
  #scratch-head button { flex: 1; background: #fff; border: 1px solid #d6d3d1; padding: 6px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; color: #44403c; }
  #scratch-head button:hover { background: #fafaf9; }
  #scratch-list { flex: 1; overflow-y: auto; padding: 10px; }
  #scratch-list.drop-target { background: #f0fdf4; }

  .block { background: #fff; border: 1px solid #d6d3d1; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; cursor: grab; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
  .block:active { cursor: grabbing; }
  .block.dragging { opacity: 0.4; }
  .block.guideline { border-left: 3px solid #0ea5e9; background: #f0f9ff; }
  .block.proposition { border-left: 3px solid #f97316; }
  .block .tag { font-size: 10px; letter-spacing: 0.8px; text-transform: uppercase; color: #78716c; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
  .block .tag .del { cursor: pointer; color: #a8a29e; padding: 0 4px; }
  .block .tag .del:hover { color: #dc2626; }
  .block .title { font-weight: 600; font-size: 14px; outline: none; margin-bottom: 4px; }
  .block .title:empty::before { content: "제목…"; color: #ccc; }
  .block .body { font-size: 13px; color: #44403c; line-height: 1.5; outline: none; white-space: pre-wrap; min-height: 1.5em; }
  .block .body:empty::before { content: "내용…"; color: #ccc; }

  .guideline .children { margin-top: 8px; padding: 6px 6px 2px; border-top: 1px dashed #cbd5e1; min-height: 28px; }
  .guideline .children.empty::before { content: "여기에 명제를 끌어 놓기"; font-size: 11px; color: #94a3b8; display: block; text-align: center; padding: 4px 0; }
  .guideline .children.drop-here { background: #ecfeff; border-radius: 4px; }
  .guideline .children .block { background: #fff; margin-bottom: 6px; }
  .guideline .children .block.proposition { background: #fffbf5; }

  #scratch-empty { text-align: center; color: #a8a29e; font-size: 12px; padding: 30px 10px; }

  /* Drag handle + add button + selection */
  .doc-item { padding-left: 52px; border-radius: 4px; }
  .item-affordances {
    position: absolute; left: 0; top: 2px;
    display: flex; gap: 2px;
    opacity: 0; transition: opacity 0.1s;
  }
  .doc-item:hover .item-affordances,
  .doc-item.selected .item-affordances,
  .doc-item:focus-within .item-affordances { opacity: 1; }
  .add-btn, .drag-handle {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    color: #cbd5e1; user-select: none;
    border-radius: 3px;
    font-size: 12px;
    cursor: pointer;
  }
  .add-btn:hover, .drag-handle:hover { color: #1a1a1a; background: #e7e5e4; }
  .drag-handle { cursor: grab; }
  .drag-handle:active { cursor: grabbing; }
  .add-btn { font-size: 16px; line-height: 1; }
  .doc-item.selected { background: #dbeafe; }
  .doc-item.selected .drag-handle { color: #1d4ed8; }
  .doc-item.dragging-item { opacity: 0.3; }

  /* Divider + quote */
  .doc-divider { border: none; border-top: 1px solid #d6d3d1; margin: 18px 0; height: 0; }
  .doc-quote {
    border-left: 4px solid #0ea5e9; background: #f0f9ff;
    padding: 10px 14px; margin: 8px 0; font-size: 15px;
    line-height: 1.6; color: #0c4a6e; outline: none; font-style: italic;
    border-radius: 0 4px 4px 0;
  }

  /* Selection toolbar */
  #selection-toolbar {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #1f1f1f; color: #f5f5f4; padding: 8px 14px; border-radius: 8px;
    display: flex; gap: 8px; align-items: center; box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    z-index: 100; font-size: 12px;
  }
  #selection-toolbar[hidden] { display: none; }
  #selection-toolbar .count { color: #9a9a9a; margin-right: 4px; }
  #selection-toolbar button {
    background: #2e2e2e; color: #f5f5f4; border: 1px solid #3a3a3a;
    padding: 4px 10px; font-size: 12px; border-radius: 4px; cursor: pointer;
  }
  #selection-toolbar button:hover { background: #3a3a3a; }
  #selection-toolbar button.danger:hover { background: #7f1d1d; border-color: #991b1b; }

  /* Slash menu */
  #slash-menu {
    position: fixed; z-index: 200; background: #fff;
    border: 1px solid #d6d3d1; border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    min-width: 220px; max-height: 280px; overflow-y: auto;
    padding: 4px;
  }
  #slash-menu[hidden] { display: none; }
  .slash-item { padding: 6px 10px; border-radius: 4px; cursor: pointer; }
  .slash-item:hover, .slash-item.active { background: #ecfeff; }
  .slash-label { font-size: 13px; font-weight: 600; color: #1a1a1a; }
  .slash-hint { font-size: 11px; color: #78716c; margin-top: 1px; }
  .slash-empty { padding: 10px; text-align: center; color: #a8a29e; font-size: 12px; }
  .slash-section-head { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: #a8a29e; padding: 6px 10px 2px; }

  /* Scratch block: collapsed by default, expanded when focused inside */
  .block .body {
    max-height: 2.4em;
    overflow: hidden;
    font-size: 12px;
    color: #78716c;
    transition: max-height 0.18s ease, font-size 0.15s, color 0.15s;
    position: relative;
  }
  .block .body::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0; height: 1em;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.95));
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.15s;
  }
  .block.guideline .body::after { background: linear-gradient(to bottom, rgba(240,249,255,0), rgba(240,249,255,0.98)); }
  .block:focus-within .body { max-height: 600px; font-size: 13px; color: #44403c; }
  .block:focus-within .body::after { opacity: 0; }
  .block:focus-within { box-shadow: 0 0 0 2px #0ea5e9, 0 4px 12px rgba(14,165,233,0.15); }
  .block .title { cursor: text; }

  /* Preview mode: strip all "block-like" chrome; sections become a slim left guide. */
  body.preview-mode #scratch-pane,
  body.preview-mode #splitter,
  body.preview-mode .item-affordances,
  body.preview-mode .doc-item .controls,
  body.preview-mode .doc-section .label,
  body.preview-mode .doc-card .card-head,
  body.preview-mode #selection-toolbar { display: none !important; }
  body.preview-mode #canvas-pane { padding: 60px 80px; }
  body.preview-mode .doc-item { padding-left: 0; background: transparent !important; }
  body.preview-mode #canvas-title:empty::before,
  body.preview-mode .doc-para:empty::before,
  body.preview-mode .doc-card .card-title:empty::before,
  body.preview-mode .doc-card .card-body:empty::before { content: ""; }
  body.preview-mode [contenteditable] { outline: none; cursor: text; }

  /* Section in preview: just a slim left guide bar + clean heading text */
  body.preview-mode .doc-section {
    background: transparent;
    color: #1a1a1a;
    border-left: 3px solid #d6d3d1;
    border-radius: 0;
    padding: 6px 0 6px 14px;
    margin: 28px 0 12px;
    font-size: 22px;
    font-weight: 700;
  }
  /* Card in preview: no box, no border, no tag — just bold title + flowing body */
  body.preview-mode .doc-card {
    border: none;
    background: transparent;
    box-shadow: none !important;
    padding: 6px 0;
  }
  body.preview-mode .doc-card:focus-within { box-shadow: none; border: none; }
  body.preview-mode .doc-card .card-title {
    font-size: 17px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 2px;
  }
  body.preview-mode .doc-card .card-body {
    font-size: 16px;
    color: #1a1a1a;
    line-height: 1.75;
    white-space: pre-wrap;
  }
  /* doc-text in preview: drop the left border, treat as paragraph */
  body.preview-mode .doc-text {
    border-left: none;
    padding-left: 0;
    font-size: 16px;
    color: #1a1a1a;
  }
  body.preview-mode .doc-text .src { color: #78716c; }

  /* Toolbar separator */
  header .gap { width: 6px; }

  /* ============================================================
     Round 7: writing-craft features (role chips, source/note,
     diagnostic panel, snippet bank)
     ============================================================ */

  /* Role chip on scratch blocks + canvas cards */
  .role-chip {
    display: inline-flex; align-items: center;
    padding: 1px 7px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.4px;
    border-radius: 10px; cursor: pointer; user-select: none;
    border: 1px solid currentColor;
    line-height: 1.4;
  }
  .role-chip.unset { color: #a8a29e; border-style: dashed; background: transparent; font-weight: 500; }
  .role-chip:hover { filter: brightness(0.94); }

  /* Role picker popover */
  #role-picker {
    position: fixed; z-index: 250; background: #fff;
    border: 1px solid #d6d3d1; border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    padding: 4px; min-width: 180px;
  }
  #role-picker[hidden] { display: none; }
  #role-picker .role-option {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 4px; cursor: pointer;
    font-size: 13px;
  }
  #role-picker .role-option:hover { background: #f5f5f4; }
  #role-picker .role-option .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  #role-picker .role-option .unset-mark { color: #a8a29e; font-size: 11px; margin-left: auto; }

  /* Source + Note fields (scratch block, expanded only) */
  .block { position: relative; }
  .block .meta-fields {
    margin-top: 8px;
    display: none;
    flex-direction: column;
    gap: 6px;
    border-top: 1px dashed #e7e5e4;
    padding-top: 8px;
  }
  .block:focus-within .meta-fields { display: flex; }
  .block .meta-field { display: flex; align-items: flex-start; gap: 6px; }
  .block .meta-field label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
    text-transform: uppercase; color: #78716c;
    min-width: 38px; padding-top: 4px;
    flex-shrink: 0;
  }
  .block .meta-field .input {
    flex: 1; outline: none;
    font-size: 12px; color: #44403c;
    background: #fafaf9; border: 1px solid #e7e5e4; border-radius: 3px;
    padding: 3px 6px;
    min-height: 1.4em;
  }
  .block .meta-field .input:empty::before {
    content: attr(data-placeholder); color: #cbd5e1;
  }
  .block .meta-field .input:focus { background: #fff; border-color: #0ea5e9; }
  .block .meta-field.note .input { min-height: 2.6em; font-style: italic; color: #57534e; }

  /* "missing source" dot on propositions */
  .block.proposition:not(:focus-within) .src-missing {
    position: absolute; top: 8px; right: 8px;
    width: 6px; height: 6px; border-radius: 50%;
    background: #f97316; opacity: 0.7;
    pointer-events: none;
  }

  /* Diagnostic panel (floating right) */
  #diagnostic-fab {
    position: fixed; top: 60px; right: 14px; z-index: 90;
    background: #1f1f1f; color: #f5f5f4; border: 1px solid #3a3a3a;
    width: 38px; height: 38px; border-radius: 19px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  #diagnostic-fab:hover { background: #2e2e2e; }
  #diagnostic-fab .badge {
    position: absolute; top: -4px; right: -4px;
    background: #dc2626; color: #fff;
    min-width: 16px; height: 16px; border-radius: 8px;
    font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    padding: 0 4px;
  }
  #diagnostic-fab .badge[hidden] { display: none; }
  body.preview-mode #diagnostic-fab { display: none; }

  #diagnostic-panel {
    position: fixed; top: 56px; right: 14px; z-index: 95;
    width: 320px; max-height: calc(100vh - 80px);
    background: #fff; color: #1a1a1a;
    border: 1px solid #d6d3d1; border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.18);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #diagnostic-panel[hidden] { display: none; }
  #diagnostic-panel .head {
    padding: 10px 14px; border-bottom: 1px solid #e7e5e4;
    display: flex; align-items: center; justify-content: space-between;
    background: #fafaf9;
  }
  #diagnostic-panel .head h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.4px; }
  #diagnostic-panel .head .close {
    background: transparent; border: none; cursor: pointer;
    color: #78716c; font-size: 16px; padding: 2px 6px; border-radius: 3px;
  }
  #diagnostic-panel .head .close:hover { background: #e7e5e4; }
  #diagnostic-panel .body { padding: 10px 14px; overflow-y: auto; flex: 1; font-size: 12px; }
  #diagnostic-panel .section-h {
    font-size: 10px; font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase; color: #a8a29e;
    margin: 10px 0 4px;
  }
  #diagnostic-panel .section-h:first-child { margin-top: 0; }
  #diagnostic-panel .stat-row {
    display: flex; justify-content: space-between;
    padding: 2px 0; font-size: 12px;
  }
  #diagnostic-panel .role-bar {
    display: flex; align-items: center; gap: 6px;
    margin: 2px 0;
  }
  #diagnostic-panel .role-bar .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  #diagnostic-panel .role-bar .label { flex: 1; }
  #diagnostic-panel .role-bar .count { font-weight: 600; color: #1a1a1a; min-width: 24px; text-align: right; }
  #diagnostic-panel .warn {
    background: #fef3c7; color: #92400e; padding: 6px 8px;
    border-radius: 4px; font-size: 11px; margin: 4px 0;
    border-left: 3px solid #f59e0b;
  }
  #diagnostic-panel .warn.error {
    background: #fee2e2; color: #991b1b;
    border-left-color: #dc2626;
  }
  #diagnostic-panel .warn.info {
    background: #ecfeff; color: #155e75;
    border-left-color: #0ea5e9;
  }
  #diagnostic-panel .nothing {
    color: #a8a29e; font-style: italic; font-size: 11px;
    padding: 4px 0;
  }

  /* Snippet menu — floating button on focused para + popup */
  .snippet-trigger {
    position: absolute; right: -32px; top: 0;
    width: 24px; height: 24px;
    display: none; align-items: center; justify-content: center;
    background: #fff; border: 1px solid #d6d3d1; border-radius: 4px;
    cursor: pointer; color: #78716c; font-size: 12px;
  }
  .doc-item:focus-within > .snippet-trigger { display: flex; }
  .snippet-trigger:hover { color: #0ea5e9; border-color: #0ea5e9; }

<script>
// ============================================================
// State
// Schema:
//   state = { title, blocks[], doc[] }
//   block = { id, type: 'proposition'|'guideline', title, body, parentId? }
//     - parentId only on propositions; references a guideline block id (means: nested)
//   doc item kinds:
//     - { id, kind: 'para',    text }
//     - { id, kind: 'section', text, level?, blockId? }   (text is own; blockId optional source pointer)
//     - { id, kind: 'card',    title, body, blockType?, blockId? }  (forked on drop, edits don't affect source)
//     - { id, kind: 'text',    text, source? }
//     - { id, kind: 'divider' }
//     - { id, kind: 'quote',   text }
// ============================================================
const LEGACY_KEY = "block-writer-v1";  // localStorage key from pre-SQLite era (migration source)
let state = { title: "", blocks: [], doc: [] };
let importMode = null; // "merge" | "replace"
let currentDocId = null;     // current document id (from /api/documents)
let documents = [];          // list of { id, title, ... }
const selectedItemIds = new Set(); // referenced inside renderDocItem during initial render

// --- Roles (writing-craft taxonomy) ---
const ROLES = [
  { key: "claim",       ko: "주장",   color: "#0ea5e9", bg: "#ecfeff" },
  { key: "evidence",    ko: "근거",   color: "#16a34a", bg: "#f0fdf4" },
  { key: "counter",     ko: "반박",   color: "#dc2626", bg: "#fef2f2" },
  { key: "definition",  ko: "정의",   color: "#7c3aed", bg: "#f5f3ff" },
  { key: "example",     ko: "사례",   color: "#ea580c", bg: "#fff7ed" },
  { key: "quote",       ko: "인용",   color: "#475569", bg: "#f8fafc" },
  { key: "implication", ko: "함의",   color: "#9333ea", bg: "#faf5ff" },

  { key: "hypothesis",  ko: "가설",   color: "#ca8a04", bg: "#fefce8" },

const ROLE_BY_KEY = Object.fromEntries(ROLES.map(r => [r.key, r]));

// --- Genre templates ---
const TEMPLATES = {

      { type: "guideline", title: "2. 핵심 주장",     body: "통념과 정면으로 다른 한 줄 주장.",                          role: "claim" },
      { type: "guideline", title: "3. 근거 3개",      body: "주장을 받치는 구체적 근거 3개 (수치·사건·1차 출처).",        role: "evidence" },
      { type: "guideline", title: "4. 반박과 재반박", body: "가장 강한 반대 논리를 인정한 뒤 무력화.",                    role: "counter" },
      { type: "guideline", title: "5. 함의와 행동 촉구", body: "독자가 무엇을 다르게 봐야 하는가.",                       role: "implication" },

      { type: "guideline", title: "2. 동요",   body: "그 장면이 내 안에서 흔들어 놓은 질문.",          role: "question" },
      { type: "guideline", title: "3. 사색",   body: "이 동요를 거치며 떠오른 더 큰 패턴.",            role: "implication" },
      { type: "guideline", title: "4. 회상",   body: "비슷한 옛 장면 또는 인용으로 패턴 확장.",        role: "quote" },
      { type: "guideline", title: "5. 도착",   body: "그래서 지금 내가 어떻게 다르게 보고 있는가.",    role: "claim" },
    ]
  },
};

// --- Snippet library (lawyer-grade transitions) ---
const SNIPPETS = [
  { cat: "주장 도입",   text: "이 글의 결정적 주장은 다음과 같다 — " },
  { cat: "주장 도입",   text: "한 줄로 압축하면, " },
  { cat: "근거 제시",   text: "이 주장은 다음 근거 위에 서 있다. 첫째, " },
  { cat: "근거 제시",   text: "정량적으로 보면 — " },
  { cat: "반박 인정",   text: "물론 강한 반대 논리가 있다. " },
  { cat: "반박 인정",   text: "이 주장의 가장 약한 지점은 " },
  { cat: "재반박",      text: "그러나 이 반박은 X를 놓치고 있다 — " },
  { cat: "재반박",      text: "이 반론을 충분히 인정한다 해도, " },
  { cat: "연결/심화",   text: "이 지점이 중요한 이유는 " },
  { cat: "연결/심화",   text: "한 단계 더 들어가 보면, " },
  { cat: "조건 명시",   text: "이 결론은 X라는 가정 위에 서 있다 — " },
  { cat: "조건 명시",   text: "단, 다음 조건이 깨지면 결론도 바뀐다: " },
  { cat: "감성/임팩트", text: "이 변화의 무게를 가늠하려면, 한 사람의 자리에서 보자 — " },
  { cat: "감성/임팩트", text: "숫자 뒤에는 — " },
  { cat: "결론 도입",   text: "결국 이 모든 것이 가리키는 방향은 하나다 — " },
];

function uid() { return Math.random().toString(36).slice(2, 10); }

async function fetchDocuments() {
  const r = await fetch("/api/documents", { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const data = await r.json();
  documents = data.documents || [];
  currentDocId = data.currentId || (documents[0] && documents[0].id) || null;
  renderDocSelector();
}

async function load() {
  try {
    await fetchDocuments();
    const url = currentDocId ? `/api/state?doc=${encodeURIComponent(currentDocId)}` : "/api/state";
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    state = await r.json();
  } catch (e) {
    showServerDownPanel(e);
    throw e;
  }
  if (!state.doc || state.doc.length === 0) {
    state.doc = [{ id: uid(), kind: "para", text: "" }];
  }
  if (!Array.isArray(state.blocks)) state.blocks = [];
}

function showServerDownPanel(err) {
  document.body.innerHTML =
    `<div style="padding: 60px; font-family: -apple-system, 'Segoe UI', sans-serif; max-width: 560px; margin: 0 auto;">
       <h2 style="margin:0 0 12px;">서버에 연결할 수 없음</h2>
       <p style="line-height:1.6; color:#44403c;">
         이 에디터는 백엔드(<code>serve.py</code>)와 함께 동작합니다.
         터미널에서 다음을 실행한 뒤 다시 새로고침하세요:
       </p>
       <pre style="background:#1f1f1f; color:#f5f5f4; padding:14px 18px; border-radius:6px; font-size:13px;">python serve.py</pre>
       <p style="color:#a8a29e; font-size:12px; margin-top:18px;">${String(err).replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}</p>
     </div>`;
}

function _stateUrl() {
  return currentDocId ? `/api/state?doc=${encodeURIComponent(currentDocId)}` : "/api/state";
}

let saveTimer = null;
let savePending = false;
async function flushSave() {
  if (!savePending) return;
  savePending = false;
  try {
    const r = await fetch(_stateUrl(), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    document.getElementById("status").textContent = "저장됨";
    // Title might have changed on the current doc — refresh selector label.
    const doc = documents.find(d => d.id === currentDocId);
    if (doc && doc.title !== state.title) {
      doc.title = state.title;
      renderDocSelector();
    }
  } catch (e) {
    document.getElementById("status").textContent = "저장 실패";
    console.error(e);
  }
}
function save() {
  clearTimeout(saveTimer);
  document.getElementById("status").textContent = "저장 중…";
  savePending = true;
  saveTimer = setTimeout(() => {
    snapshotNow();
    flushSave();
  }, 300);
}

function findBlock(id) { return state.blocks.find(b => b.id === id); }
function childrenOf(guidelineId) {
  return state.blocks.filter(b => b.type === "proposition" && b.parentId === guidelineId);
}
function topLevelBlocks() {
  return state.blocks.filter(b => b.type === "guideline" || !b.parentId);
}

// ============================================================
// Scratch panel
// ============================================================
const scratchList = document.getElementById("scratch-list");

function renderScratch() {
  scratchList.innerHTML = "";
  if (state.blocks.length === 0) {
    const e = document.createElement("div");
    e.id = "scratch-empty";
    e.textContent = "위 버튼으로 블럭 추가";
    scratchList.appendChild(e);
    applyPreviewLock();
    return;
  }
  topLevelBlocks().forEach(b => {
    scratchList.appendChild(renderBlock(b));
  });
  applyPreviewLock();
}

// Defined here so render fns can call it; the toggle button (further below) flips body.preview-mode.
function applyPreviewLock() {
  if (!document.body.classList.contains("preview-mode")) return;
  document.querySelectorAll("[contenteditable='true']").forEach(el => {
    if (!el.dataset.prevCe) {
      el.dataset.prevCe = "true";
      el.contentEditable = "false";
    }
  });
}

function renderBlock(b) {
  const el = document.createElement("div");
  el.className = "block " + b.type;
  el.draggable = true;
  el.dataset.id = b.id;

  // Tag row (kind + role chip + delete)
  const tag = document.createElement("div");
  tag.className = "tag";
  const kindLabel = document.createElement("span");
  kindLabel.textContent = b.type === "guideline" ? "GUIDELINE" : "PROPOSITION";
  const chip = renderRoleChip(b);
  const del = document.createElement("span");
  del.className = "del";
  del.title = "삭제";
  del.textContent = "×";
  tag.appendChild(kindLabel);
  tag.appendChild(chip);
  const spacer = document.createElement("span");
  spacer.style.flex = "1";
  tag.appendChild(spacer);
  tag.appendChild(del);

  const titleEl = document.createElement("div");
  titleEl.className = "title";
  titleEl.contentEditable = "true";
  titleEl.spellcheck = false;
  titleEl.textContent = b.title || "";

  const bodyEl = document.createElement("div");
  bodyEl.className = "body";
  bodyEl.contentEditable = "true";
  bodyEl.spellcheck = false;
  bodyEl.textContent = b.body || "";

  el.appendChild(tag);
  el.appendChild(titleEl);
  el.appendChild(bodyEl);

  // Meta fields (source + note), only visible when block is focused
  const meta = document.createElement("div");
  meta.className = "meta-fields";

  const srcRow = document.createElement("div");
  srcRow.className = "meta-field source";
  const srcLabel = document.createElement("label");
  srcLabel.textContent = "출처";
  const srcInput = document.createElement("div");
  srcInput.className = "input";
  srcInput.contentEditable = "true";
  srcInput.spellcheck = false;
  srcInput.dataset.placeholder = "URL · 1차 출처 · 인용";
  srcInput.textContent = b.source || "";
  srcRow.appendChild(srcLabel);
  srcRow.appendChild(srcInput);

  const noteRow = document.createElement("div");
  noteRow.className = "meta-field note";
  const noteLabel = document.createElement("label");
  noteLabel.textContent = "메모";
  const noteInput = document.createElement("div");
  noteInput.className = "input";
  noteInput.contentEditable = "true";
  noteInput.spellcheck = false;
  noteInput.dataset.placeholder = "이 블럭에 대한 자기 메모 (캔버스에 안 보임)";
  noteInput.textContent = b.note || "";
  noteRow.appendChild(noteLabel);
  noteRow.appendChild(noteInput);

  meta.appendChild(srcRow);
  meta.appendChild(noteRow);
  el.appendChild(meta);

  // "missing source" dot — only on propositions (definitions/quotes also typically need sources, keep narrow for now)
  if (b.type === "proposition" && !(b.source || "").trim()) {
    const dot = document.createElement("div");
    dot.className = "src-missing";
    dot.title = "출처가 비어 있음";
    el.appendChild(dot);
  }

  titleEl.addEventListener("input", () => { b.title = titleEl.textContent; save(); });
  bodyEl.addEventListener("input",  () => { b.body  = bodyEl.textContent;  save(); });
  srcInput.addEventListener("input", () => {
    b.source = srcInput.textContent;
    save();
    // Toggle the missing-source dot visibility live
    const dot = el.querySelector(".src-missing");
    if (b.type === "proposition") {
      if ((b.source || "").trim()) { if (dot) dot.remove(); }
      else if (!dot) {
        const d = document.createElement("div"); d.className = "src-missing"; d.title = "출처가 비어 있음";
        el.appendChild(d);
      }
    }
  });
  noteInput.addEventListener("input", () => { b.note = noteInput.textContent; save(); });
  del.addEventListener("click", (e) => { e.stopPropagation(); deleteBlock(b.id); });

  el.addEventListener("dragstart", (ev) => {
    ev.stopPropagation();
    el.classList.add("dragging");
    ev.dataTransfer.effectAllowed = "copyMove";
    ev.dataTransfer.setData("application/x-block-id", b.id);
  });
  el.addEventListener("dragend", () => el.classList.remove("dragging"));

  // Guideline gets a nested children area
  if (b.type === "guideline") {
    const childWrap = document.createElement("div");
    childWrap.className = "children";
    const kids = childrenOf(b.id);
    if (kids.length === 0) childWrap.classList.add("empty");
    kids.forEach(k => childWrap.appendChild(renderBlock(k)));

    // Drop target on the children area: nest a proposition
    childWrap.addEventListener("dragover", (ev) => {
      const id = getDragId(ev);
      if (!id) return;
      const dragged = findBlock(id);
      if (!dragged || dragged.type !== "proposition") return;
      if (dragged.id === b.id) return;
      ev.preventDefault();
      ev.stopPropagation();
      ev.dataTransfer.dropEffect = "move";
      childWrap.classList.add("drop-here");
    });
    childWrap.addEventListener("dragleave", () => childWrap.classList.remove("drop-here"));
    childWrap.addEventListener("drop", (ev) => {
      const id = ev.dataTransfer.getData("application/x-block-id");
      const dragged = findBlock(id);
      if (!dragged || dragged.type !== "proposition") return;
      ev.preventDefault();
      ev.stopPropagation();
      childWrap.classList.remove("drop-here");
      dragged.parentId = b.id;
      renderScratch();
      save();
    });
    el.appendChild(childWrap);
  }

  return el;
}

// Drop on scratch list background = un-nest a proposition
scratchList.addEventListener("dragover", (ev) => {
  const id = getDragId(ev);
  if (!id) return;
  const dragged = findBlock(id);
  if (!dragged || dragged.type !== "proposition" || !dragged.parentId) return;
  if (ev.target.closest(".children") || ev.target.closest(".block")) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = "move";
  scratchList.classList.add("drop-target");
});
scratchList.addEventListener("dragleave", () => scratchList.classList.remove("drop-target"));
scratchList.addEventListener("drop", (ev) => {
  const id = ev.dataTransfer.getData("application/x-block-id");
  const dragged = findBlock(id);
  if (!dragged || dragged.type !== "proposition" || !dragged.parentId) return;
  if (ev.target.closest(".children") || ev.target.closest(".block")) return;
  ev.preventDefault();
  scratchList.classList.remove("drop-target");
  delete dragged.parentId;
  renderScratch();
  save();
});

function getDragId(ev) {
  // Some browsers don't expose dataTransfer.getData during dragover, so check types
  if (!ev.dataTransfer.types.includes("application/x-block-id")) return null;
  // We can't read value during dragover reliably, but we set a stash on dragstart:
  return draggedBlockId;
}
let draggedBlockId = null;
scratchList.addEventListener("dragstart", (ev) => {
  const el = ev.target.closest(".block");
  if (el) draggedBlockId = el.dataset.id;
}, true);
scratchList.addEventListener("dragend", () => { draggedBlockId = null; }, true);

function deleteBlock(id) {
  const b = findBlock(id);
  if (!b) return;
  // If guideline, also delete (or un-nest) its children. We'll un-nest to preserve user content.
  if (b.type === "guideline") {
    state.blocks.forEach(x => { if (x.parentId === id) delete x.parentId; });
  }
  state.blocks = state.blocks.filter(x => x.id !== id);
  renderScratch();
  save();
}

document.querySelectorAll("#scratch-head button").forEach(btn => {
  btn.addEventListener("click", () => {
    const type = btn.dataset.type;
    state.blocks.unshift({ id: uid(), type, title: "", body: "" });
    renderScratch();
    save();
    const first = scratchList.querySelector(".block .title");
    if (first) first.focus();
  });
});

// ============================================================
// Canvas
// ============================================================
const docItemsEl = document.getElementById("doc-items");
const titleEl = document.getElementById("canvas-title");

titleEl.addEventListener("input", () => { state.title = titleEl.textContent; save(); });

function renderDoc() {
  docItemsEl.innerHTML = "";
  state.doc.forEach((item, idx) => {
    docItemsEl.appendChild(renderDocItem(item, idx));
  });
  applyPreviewLock();
}

function renderDocItem(item, idx) {
  const wrap = document.createElement("div");
  wrap.className = "doc-item";
  if (selectedItemIds.has(item.id)) wrap.classList.add("selected");
  wrap.dataset.idx = idx;
  wrap.dataset.id = item.id;

  // Left-side affordances: + (add new para below) and ⋮⋮ (drag/select)
  const affordances = document.createElement("div");
  affordances.className = "item-affordances";

  const addBtn = document.createElement("div");
  addBtn.className = "add-btn";
  addBtn.textContent = "+";
  addBtn.title = "이 항목 아래에 새 단락 추가";
  addBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    insertParaAfter(item.id);
  });

  const handle = document.createElement("div");
  handle.className = "drag-handle";
  handle.textContent = "⋮⋮";
  handle.title = "드래그=이동 · 클릭=선택 · Shift+클릭=범위 · Ctrl+클릭=추가";
  handle.draggable = true;
  handle.addEventListener("click", (e) => {
    e.stopPropagation();
    handleSelectionClick(item.id, e);
  });
  handle.addEventListener("dragstart", (e) => {
    e.stopPropagation();
    let ids;
    if (selectedItemIds.has(item.id) && selectedItemIds.size > 1) {
      ids = state.doc.filter(x => selectedItemIds.has(x.id)).map(x => x.id);
    } else {
      ids = [item.id];
    }
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("application/x-doc-item-ids", JSON.stringify(ids));
    ids.forEach(id => {
      const el = docItemsEl.querySelector(`[data-id="${id}"]`);
      if (el) el.classList.add("dragging-item");
    });
  });
  handle.addEventListener("dragend", () => {
    docItemsEl.querySelectorAll(".dragging-item").forEach(el => el.classList.remove("dragging-item"));
  });

  affordances.appendChild(addBtn);
  affordances.appendChild(handle);
  wrap.appendChild(affordances);

  if (item.kind === "para") {
    const p = document.createElement("div");
    p.className = "doc-para";
    p.contentEditable = "true";
    p.spellcheck = false;
    p.textContent = item.text || "";
    p.addEventListener("input", () => {
      item.text = p.textContent;
      save();
      maybeOpenSlashMenu(item, p);
    });
    p.addEventListener("keydown", (e) => onParaKeydown(e, item, p));
    p.addEventListener("paste", (e) => onParaPaste(e, item, p));
    p.addEventListener("blur", () => { setTimeout(closeSlashMenu, 120); });
    wrap.appendChild(p);
  } else if (item.kind === "section") {
    const s = document.createElement("div");
    s.className = "doc-section";
    s.innerHTML = `<span class="label">SECTION</span>`;
    const inner = document.createElement("div");
    inner.spellcheck = false;
    inner.style.outline = "none";
    inner.contentEditable = "true";
    inner.textContent = item.text || "";
    inner.addEventListener("input", () => { item.text = inner.textContent; save(); });
    inner.addEventListener("keydown", (e) => onSimpleKeydown(e, item, inner));
    s.appendChild(inner);
    wrap.appendChild(s);
  } else if (item.kind === "card") {
    const c = document.createElement("div");
    c.className = "doc-card";
    const tag = (item.blockType === "guideline") ? "GUIDELINE" : "PROPOSITION";
    const head = document.createElement("div");
    head.className = "card-head";
    head.textContent = tag;
    const titleEl_ = document.createElement("div");
    titleEl_.className = "card-title";
    titleEl_.contentEditable = "true";
    titleEl_.spellcheck = false;
    titleEl_.dataset.placeholder = "제목";
    titleEl_.textContent = item.title || "";
    titleEl_.addEventListener("input", () => { item.title = titleEl_.textContent; save(); });
    titleEl_.addEventListener("keydown", (e) => onCardKeydown(e, item, titleEl_, bodyEl_, "title"));
    const bodyEl_ = document.createElement("div");
    bodyEl_.className = "card-body";
    bodyEl_.contentEditable = "true";
    bodyEl_.spellcheck = false;
    bodyEl_.dataset.placeholder = "본문";
    bodyEl_.textContent = item.body || "";
    bodyEl_.addEventListener("input", () => { item.body = bodyEl_.textContent; save(); });
    bodyEl_.addEventListener("keydown", (e) => onCardKeydown(e, item, titleEl_, bodyEl_, "body"));
    c.appendChild(head);
    c.appendChild(titleEl_);
    c.appendChild(bodyEl_);
    wrap.appendChild(c);
  } else if (item.kind === "text") {
    const t = document.createElement("div");
    t.className = "doc-text";
    t.contentEditable = "true";
    t.spellcheck = false;
    t.textContent = item.text || "";
    t.addEventListener("input", () => { item.text = t.textContent; save(); });
    t.addEventListener("keydown", (e) => onSimpleKeydown(e, item, t));
    const src = document.createElement("span");
    src.className = "src";
    src.textContent = item.source ? `— ${item.source}에서` : "";
    t.appendChild(src);
    wrap.appendChild(t);
  } else if (item.kind === "divider") {
    const hr = document.createElement("hr");
    hr.className = "doc-divider";
    wrap.appendChild(hr);
  } else if (item.kind === "quote") {
    const q = document.createElement("div");
    q.className = "doc-quote";
    q.contentEditable = "true";
    q.spellcheck = false;
    q.textContent = item.text || "";
    q.addEventListener("input", () => { item.text = q.textContent; save(); });
    q.addEventListener("keydown", (e) => onSimpleKeydown(e, item, q));
    wrap.appendChild(q);
  }

  const controls = document.createElement("div");
  controls.className = "controls";
  if (item.kind === "card" || item.kind === "text") {
    const toggle = document.createElement("button");
    toggle.textContent = item.kind === "card" ? "→ 텍스트" : "→ 카드";
    toggle.title = "표시 형식 토글";
    toggle.addEventListener("click", () => toggleItem(item));
    controls.appendChild(toggle);
  }
  const del = document.createElement("button");
  del.textContent = "삭제";
  del.addEventListener("click", () => removeItem(item.id));
  controls.appendChild(del);
  wrap.appendChild(controls);

  wrap.addEventListener("dragover", (e) => {
    const types = e.dataTransfer.types;
    const isBlock = types.includes("application/x-block-id");
    const isDocItem = types.includes("application/x-doc-item-ids");
    if (!isBlock && !isDocItem) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = isDocItem ? "move" : "copy";
    const rect = wrap.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height / 2;
    wrap.classList.toggle("drag-over-top", before);
    wrap.classList.toggle("drag-over-bottom", !before);
  });
  wrap.addEventListener("dragleave", () => {
    wrap.classList.remove("drag-over-top", "drag-over-bottom");
  });
  wrap.addEventListener("drop", (e) => {
    const rect = wrap.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height / 2;
    wrap.classList.remove("drag-over-top", "drag-over-bottom");
    const at = state.doc.findIndex(x => x.id === item.id);

    const docItemIdsRaw = e.dataTransfer.getData("application/x-doc-item-ids");
    if (docItemIdsRaw) {
      e.preventDefault();
      try {
        const ids = JSON.parse(docItemIdsRaw);
        moveDocItems(ids, before ? at : at + 1);
      } catch {}
      return;
    }
    const blockId = e.dataTransfer.getData("application/x-block-id");
    if (blockId) {
      e.preventDefault();
      insertBlockAt(blockId, before ? at : at + 1);
    }
  });

  return wrap;
}

function insertParaAfter(itemId) {
  const idx = state.doc.findIndex(x => x.id === itemId);
  if (idx < 0) return;
  const newItem = { id: uid(), kind: "para", text: "" };
  state.doc.splice(idx + 1, 0, newItem);
  renderDoc();
  save();
  focusItem(newItem.id);
}

// Card-specific keydown: Enter/Tab navigation between title→body, Alt+arrow moves item,
// Backspace on empty body+title removes the card.
function onCardKeydown(e, item, titleEl, bodyEl, which) {
  if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
    e.preventDefault();
    moveItemBy(item.id, e.key === "ArrowUp" ? -1 : 1);
    return;
  }
  if (which === "title") {
    if (e.key === "Enter" || (e.key === "Tab" && !e.shiftKey)) {
      e.preventDefault();
      bodyEl.focus();
      return;
    }
  }
  if (which === "body") {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      // Ctrl+Enter: leave the card, create a new para after it, focus.
      e.preventDefault();
      insertParaAfter(item.id);
      return;
    }
    if (e.key === "Tab" && e.shiftKey) {
      e.preventDefault();
      titleEl.focus();
      return;
    }
  }
  // Delete an empty card with Backspace on the body if both fields are empty.
  if (e.key === "Backspace" && !(item.title || "").trim() && !(item.body || "").trim()) {
    e.preventDefault();
    const idx = state.doc.findIndex(x => x.id === item.id);
    if (idx < 0) return;
    state.doc.splice(idx, 1);
    if (state.doc.length === 0) state.doc.push({ id: uid(), kind: "para", text: "" });
    renderDoc();
    save();
    const prev = state.doc[Math.max(0, idx - 1)];
    if (prev) focusItem(prev.id, "end");
  }
}

// Generic keydown for editable doc items (section/text/quote) — only handles backspace-to-delete and Alt+arrow
function onSimpleKeydown(e, item, el) {
  if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
    e.preventDefault();
    moveItemBy(item.id, e.key === "ArrowUp" ? -1 : 1);
    return;
  }
  if (e.key === "Backspace" && el.textContent === "" && state.doc.length > 1) {
    e.preventDefault();
    const idx = state.doc.findIndex(x => x.id === item.id);
    state.doc.splice(idx, 1);
    renderDoc();
    save();
    const prev = state.doc[Math.max(0, idx - 1)];
    if (prev) focusItem(prev.id, "end");
  }
}

function onParaKeydown(e, item, el) {
  // Slash menu navigation takes priority when open and bound to this para
  if (slashMenuEl && !slashMenuEl.hidden && slashTarget && slashTarget.item.id === item.id) {
    if (e.key === "ArrowDown") { e.preventDefault(); moveSlashSel(1); return; }
    if (e.key === "ArrowUp")   { e.preventDefault(); moveSlashSel(-1); return; }
    if (e.key === "Enter")     { e.preventDefault(); chooseSlashActive(); return; }
    if (e.key === "Escape")    { e.preventDefault(); closeSlashMenu(); return; }
  }
  if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
    e.preventDefault();
    moveItemBy(item.id, e.key === "ArrowUp" ? -1 : 1);
    return;
  }
  const idx = state.doc.findIndex(x => x.id === item.id);
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const newItem = { id: uid(), kind: "para", text: "" };
    state.doc.splice(idx + 1, 0, newItem);
    renderDoc();
    save();
    focusItem(newItem.id);
  } else if (e.key === "Backspace" && el.textContent === "" && state.doc.length > 1) {
    e.preventDefault();
    state.doc.splice(idx, 1);
    renderDoc();
    save();
    const prev = state.doc[Math.max(0, idx - 1)];
    if (prev) focusItem(prev.id, "end");
  }
}

function focusItem(id, where) {
  const el = docItemsEl.querySelector(`[data-id="${id}"] [contenteditable="true"]`);
  if (!el) return;
  el.focus();
  if (where === "end") {
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
}

function insertBlockAt(blockId, idx) {
  const b = findBlock(blockId);
  if (!b) return;
  // Fork: copy title/body so editing the placed item doesn't touch the source.
  const items = [];
  if (b.type === "guideline") {
    items.push({
      id: uid(), kind: "section",
      text: b.title || "", blockId: b.id,
    });
    childrenOf(b.id).forEach(child => {
      items.push({
        id: uid(), kind: "card",
        title: child.title || "", body: child.body || "",
        blockType: "proposition", blockId: child.id,
      });
    });
  } else {
    items.push({
      id: uid(), kind: "card",
      title: b.title || "", body: b.body || "",
      blockType: b.type, blockId: b.id,
    });
  }
  // After the drop, leave a fresh empty para so the user can keep writing.
  const followUp = { id: uid(), kind: "para", text: "" };
  const nextItem = state.doc[idx];
  const reuseExisting = nextItem && nextItem.kind === "para" && !(nextItem.text || "").trim();
  if (!reuseExisting) items.push(followUp);
  state.doc.splice(idx, 0, ...items);
  renderDoc();
  save();
  const focusTarget = reuseExisting ? nextItem.id : followUp.id;
  focusItem(focusTarget, "end");
}

function toggleItem(item) {
  if (item.kind === "card") {
    const title = item.title || "";
    const body = item.body || "";
    const composed = (title ? title + ": " : "") + body;
    const src = title || "블럭";
    Object.keys(item).forEach(k => k !== "id" && delete item[k]);
    item.kind = "text";
    item.text = composed;
    item.source = src;
  } else if (item.kind === "text") {
    const source = item.source || "발췌";
    const text = item.text || "";
    Object.keys(item).forEach(k => k !== "id" && delete item[k]);
    item.kind = "card";
    item.title = source;
    item.body = text;
    item.blockType = "proposition";
  }
  renderDoc();
  save();
}

function removeItem(id) {
  state.doc = state.doc.filter(x => x.id !== id);
  if (state.doc.length === 0) state.doc.push({ id: uid(), kind: "para", text: "" });
  renderDoc();
  save();
}

const canvasPane = document.getElementById("canvas-pane");
canvasPane.addEventListener("dragover", (e) => {
  if (!e.dataTransfer.types.includes("application/x-block-id")) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "copy";
});
canvasPane.addEventListener("drop", (e) => {
  const blockId = e.dataTransfer.getData("application/x-block-id");
  if (!blockId) return;
  if (e.target.closest(".doc-item")) return;
  e.preventDefault();
  insertBlockAt(blockId, state.doc.length);
});

// ============================================================
// Import / export
// ============================================================
document.getElementById("btn-export").addEventListener("click", () => {
  // Server route streams the file with proper Content-Disposition.
  // Use the title for the filename when present by re-routing through a blob.
  const a = document.createElement("a");
  const fname = (state.title || "block-writer").replace(/[\\/:*?"<>|]/g, "_") + ".json";
  // Build blob from current in-memory state so name reflects title.
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = fname;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("btn-replace").addEventListener("click", () => {
  importMode = "replace";
  document.getElementById("file-input").click();
});
document.getElementById("btn-merge").addEventListener("click", () => {
  importMode = "merge";
  document.getElementById("file-input").click();
});

document.getElementById("file-input").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const text = await f.text();
  try {
    // Validate JSON client-side so we can show a clearer error.
    JSON.parse(text);
  } catch (err) {
    alert("JSON 파싱 실패: " + err.message);
    e.target.value = "";
    return;
  }
  // Ask the user: import into the CURRENT doc, or create a NEW doc for this file?
  const intoNewDoc = confirm("새 글로 가져올까요?\n\n[확인] = 새 글 생성 후 거기로 import (안전)\n[취소] = 현재 글에 import (현재 글이 덮이거나 합쳐짐)");
  try {
    const params = new URLSearchParams();
    params.set("mode", importMode || "replace");
    if (intoNewDoc) {
      params.set("new_doc", "1");
    } else if (currentDocId) {
      params.set("doc", currentDocId);
    }
    const r = await fetch(`/api/import?${params}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: text,
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.error || ("HTTP " + r.status));
    }
    if (intoNewDoc) {
      // Server already switched current to the new doc; reload from /api/documents.
      await fetchDocuments();
    }
    await load();
    hydrate();
    historyStack = [JSON.stringify(state)];
    flashStatus(importMode === "merge" ? "덧붙여짐" : "교체됨");
  } catch (err) {
    alert("import 실패: " + err.message);
  }
  e.target.value = "";
});

function normalizeImport(incoming) {
  // Ensure required fields exist
  const s = {
    title: incoming.title || "",
    blocks: Array.isArray(incoming.blocks) ? incoming.blocks : [],
    doc: Array.isArray(incoming.doc) ? incoming.doc : []
  };
  // Re-issue IDs to avoid clashes? On replace we don't strictly need to, but normalize missing IDs.
  const blockIdMap = {};
  s.blocks = s.blocks.map(b => {
    const newId = b.id || uid();
    blockIdMap[b.id || newId] = newId;
    return { ...b, id: newId };
  });
  s.blocks.forEach(b => {
    if (b.parentId && blockIdMap[b.parentId]) b.parentId = blockIdMap[b.parentId];
  });
  s.doc = s.doc.map(it => {
    const out = { ...it, id: it.id || uid() };
    if (out.blockId && blockIdMap[out.blockId]) out.blockId = blockIdMap[out.blockId];
    return out;
  });
  if (s.doc.length === 0) s.doc = [{ id: uid(), kind: "para", text: "" }];
  return s;
}

function mergeImport(incoming) {
  // Remap every incoming ID to a fresh one to avoid collisions.
  const blockIdMap = {};
  const incomingBlocks = Array.isArray(incoming.blocks) ? incoming.blocks : [];
  incomingBlocks.forEach(b => { blockIdMap[b.id] = uid(); });
  const newBlocks = incomingBlocks.map(b => ({
    ...b,
    id: blockIdMap[b.id],
    parentId: b.parentId && blockIdMap[b.parentId] ? blockIdMap[b.parentId] : (b.parentId || undefined)
  }));
  // Drop any parentId pointing to a non-imported, non-existing guideline
  newBlocks.forEach(b => {
    if (b.parentId && !blockIdMap[b.parentId] && !findBlock(b.parentId)) delete b.parentId;
  });

  const incomingDoc = Array.isArray(incoming.doc) ? incoming.doc : [];
  const newDocItems = incomingDoc.map(it => {
    const out = { ...it, id: uid() };
    if (out.blockId && blockIdMap[out.blockId]) out.blockId = blockIdMap[out.blockId];
    return out;
  });

  state.blocks = state.blocks.concat(newBlocks);
  // Append doc items at the end (skip trailing empty paragraphs)
  while (state.doc.length > 0) {
    const last = state.doc[state.doc.length - 1];
    if (last.kind === "para" && !(last.text || "").trim()) state.doc.pop();
    else break;
  }
  state.doc = state.doc.concat(newDocItems);
  if (state.doc.length === 0) state.doc = [{ id: uid(), kind: "para", text: "" }];
  // If title is empty and incoming has one, adopt it
  if (!state.title && incoming.title) state.title = incoming.title;

  hydrate();
  save();
}

document.getElementById("btn-clear").addEventListener("click", async () => {
  if (!confirm("현재 글의 모든 내용을 초기화합니다 (다른 글은 안전). 진행할까요?")) return;
  const empty = { title: "", blocks: [], doc: [{ id: uid(), kind: "para", text: "" }] };
  try {
    const r = await fetch(_stateUrl(), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(empty),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    state = empty;
    historyStack = [JSON.stringify(state)];
    redoStack = [];
    hydrate();
    flashStatus("초기화됨");
    // Refresh document title in the selector.
    const doc = documents.find(d => d.id === currentDocId);
    if (doc) { doc.title = ""; renderDocSelector(); }
  } catch (e) {
    alert("초기화 실패: " + e.message);

});

// ============================================================
// Boot (async — server-backed)
// ============================================================
function hydrate() {
  titleEl.textContent = state.title || "";
  renderScratch();
  renderDoc();
}

async function boot() {
  try {
    await load();
  } catch (e) { return; }   // server down panel already shown
  if (hydrateLegacyRefs()) {
    // Persist the migrated state right away so we never re-run this on next boot.
    await pushStateToServer();
  }
  hydrate();
  // Initialize history with the loaded state as the first snapshot
  historyStack = [JSON.stringify(state)];
  await maybeOfferMigration();
}

// One-time on-load migration: older doc items used blockId as a live reference
// (card with only blockId, section with only blockId). Copy source title/body into
// the item so it becomes a forked, independently editable copy.
function hydrateLegacyRefs() {
  let changed = false;
  for (const item of state.doc) {
    if (item.kind === "card") {
      const hasOwn = (item.title != null && item.title !== "") || (item.body != null && item.body !== "");
      if (!hasOwn && item.blockId) {
        const b = state.blocks.find(x => x.id === item.blockId);
        if (b) {
          item.title = b.title || "";
          item.body = b.body || "";
          item.blockType = b.type;
          changed = true;
        }
      }
    } else if (item.kind === "section") {
      if ((!item.text || item.text === "") && item.blockId) {
        const b = state.blocks.find(x => x.id === item.blockId);
        if (b) {
          item.text = b.title || "";
          changed = true;
        }
      }
    }
  }
  return changed;
}

async function maybeOfferMigration() {
  let legacy = null;
  try {
    const raw = localStorage.getItem(LEGACY_KEY);
    if (raw) legacy = JSON.parse(raw);
  } catch {}
  if (!legacy) return;
  const dbEmpty =
    state.blocks.length === 0 &&
    state.doc.length <= 1 &&
    !(state.doc[0] && state.doc[0].text);
  const message = dbEmpty
    ? "이전 버전에서 저장한 localStorage 데이터를 발견했습니다.\n\nSQLite DB로 옮길까요?\n(이후 localStorage 데이터는 삭제됩니다.)"
    : "이전 버전 localStorage 데이터가 있지만 현재 DB에도 내용이 있습니다.\n\n덧붙이기(merge)로 합칠까요? (취소하면 무시)";
  if (!confirm(message)) return;
  const mode = dbEmpty ? "replace" : "merge";
  try {
    const r = await fetch(`/api/import?mode=${mode}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(legacy),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    localStorage.removeItem(LEGACY_KEY);
    await load();
    hydrate();
    historyStack = [JSON.stringify(state)];
    flashStatus("마이그레이션 완료");
  } catch (e) {
    alert("마이그레이션 실패: " + e.message);
  }
}

boot();

// ============================================================
// Splitter (resizable scratch pane)
// ============================================================
(() => {
  const splitter = document.getElementById("splitter");
  const scratchPane = document.getElementById("scratch-pane");
  const SAVED = "block-writer-pane-w";
  const savedW = parseInt(localStorage.getItem(SAVED) || "0", 10);
  if (savedW >= 220) scratchPane.style.width = savedW + "px";

  let resizing = false;
  splitter.addEventListener("mousedown", (e) => {
    resizing = true;
    splitter.classList.add("dragging");
    document.body.classList.add("resizing");
    e.preventDefault();
  });
  document.addEventListener("mousemove", (e) => {
    if (!resizing) return;
    const w = window.innerWidth - e.clientX;
    const clamped = Math.max(220, Math.min(window.innerWidth - 320, w));
    scratchPane.style.width = clamped + "px";
  });
  document.addEventListener("mouseup", () => {
    if (!resizing) return;
    resizing = false;
    splitter.classList.remove("dragging");
    document.body.classList.remove("resizing");
    localStorage.setItem(SAVED, parseInt(scratchPane.style.width, 10) || 360);
  });
})();

// ============================================================
// Copy entire canvas (markdown-flavored plain text)
// ============================================================
function canvasToText() {
  const out = [];
  if (state.title) { out.push("# " + state.title); out.push(""); }
  for (const item of state.doc) {
    if (item.kind === "para") {
      out.push(item.text || "");
      out.push("");
    } else if (item.kind === "section") {
      out.push("## " + (item.text || ""));
      out.push("");
    } else if (item.kind === "card") {
      const tag = (item.blockType === "guideline") ? "[GUIDELINE]" : "[PROPOSITION]";
      out.push(`> ${tag} ${item.title || ""}`.trim());
      if (item.body) item.body.split(/\n/).forEach(line => out.push("> " + line));
      out.push("");
    } else if (item.kind === "text") {
      out.push(item.text || "");
      if (item.source) out.push(`— ${item.source}에서`);
      out.push("");
    } else if (item.kind === "divider") {
      out.push("---");
      out.push("");
    } else if (item.kind === "quote") {
      (item.text || "").split(/\n/).forEach(line => out.push("> " + line));
      out.push("");
    }
  }
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

function flashStatus(msg) {
  const el = document.getElementById("status");
  const prev = el.textContent;
  el.textContent = msg;
  setTimeout(() => { el.textContent = prev; }, 1200);
}

document.getElementById("btn-copy").addEventListener("click", async () => {
  const text = canvasToText();
  try {
    await navigator.clipboard.writeText(text);
    flashStatus("복사됨");
  } catch (e) {
    // Fallback for file:// where clipboard API can be blocked
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); flashStatus("복사됨"); }
    catch { alert("복사 실패. 텍스트를 직접 선택해서 복사하세요."); }
    document.body.removeChild(ta);
  }
});

// ============================================================
// Ctrl+A inside canvas → select entire canvas content
// ============================================================
canvasPane.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === "a" || e.key === "A")) {
    e.preventDefault();
    const range = document.createRange();
    range.selectNodeContents(document.getElementById("canvas"));
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
});

// Override copy event when full canvas is selected → use clean markdown text
canvasPane.addEventListener("copy", (e) => {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  const canvas = document.getElementById("canvas");
  // Detect "select all" — range spans the whole canvas
  if (range.startContainer === canvas || range.commonAncestorContainer === canvas) {
    e.preventDefault();
    e.clipboardData.setData("text/plain", canvasToText());
    flashStatus("복사됨");
  }
});

// ============================================================
// Paste handler — multi-line paste creates multiple paragraphs (Notion-like)
// ============================================================
function onParaPaste(e, item, el) {
  const cd = e.clipboardData || window.clipboardData;
  if (!cd) return;
  const text = cd.getData("text");
  if (!text) return;
  e.preventDefault();
  const lines = text.replace(/\r/g, "").split("\n");
  // Insert first line at the current cursor position
  document.execCommand("insertText", false, lines[0]);
  if (lines.length === 1) {
    item.text = el.textContent;
    save();
    return;
  }
  // Subsequent lines → new para items, inserted after current
  const idx = state.doc.findIndex(x => x.id === item.id);
  if (idx < 0) return;
  // Capture the updated current text from DOM (execCommand modified it)
  item.text = el.textContent;
  const newItems = lines.slice(1).map(t => ({ id: uid(), kind: "para", text: t }));
  state.doc.splice(idx + 1, 0, ...newItems);
  renderDoc();
  save();
  focusItem(newItems[newItems.length - 1].id, "end");
}

// Title paste: strip newlines (it's a single-line field)
titleEl.addEventListener("paste", (e) => {
  const cd = e.clipboardData || window.clipboardData;
  if (!cd) return;
  const text = cd.getData("text");
  if (!text) return;
  e.preventDefault();
  document.execCommand("insertText", false, text.replace(/\s*\n\s*/g, " "));
  state.title = titleEl.textContent;
  save();
});

// ============================================================
// History (undo/redo)
// ============================================================
let historyStack = [];   // top entry == current state snapshot
let redoStack = [];
let isUndoRedo = false;
const HISTORY_CAP = 60;

function snapshotNow() {
  if (isUndoRedo) return;
  const snap = JSON.stringify(state);
  // Skip if identical to top
  if (historyStack.length > 0 && historyStack[historyStack.length - 1] === snap) return;
  historyStack.push(snap);
  if (historyStack.length > HISTORY_CAP) historyStack.shift();
  redoStack = [];
}

async function pushStateToServer() {
  try {
    await fetch(_stateUrl(), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state),
    });
  } catch (e) { console.error("push failed", e); }
}

function undo() {
  if (historyStack.length <= 1) return;
  // Flush pending save first so the latest snapshot is recorded
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; snapshotNow(); }
  const current = historyStack.pop();
  redoStack.push(current);
  const prev = historyStack[historyStack.length - 1];
  isUndoRedo = true;
  state = JSON.parse(prev);
  selectedItemIds.clear();
  hydrate();
  pushStateToServer();
  isUndoRedo = false;
  flashStatus("실행 취소");
}

function redo() {
  if (redoStack.length === 0) return;
  const next = redoStack.pop();
  historyStack.push(next);
  isUndoRedo = true;
  state = JSON.parse(next);
  selectedItemIds.clear();
  hydrate();
  pushStateToServer();
  isUndoRedo = false;
  flashStatus("다시 실행");
}

// historyStack is seeded by boot() after the first load(), so nothing here.

document.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (k === "y" || (k === "z" && e.shiftKey)) { e.preventDefault(); redo(); }
});

// ============================================================
// moveItemBy / moveDocItems
// ============================================================
function moveItemBy(itemId, delta) {
  const idx = state.doc.findIndex(x => x.id === itemId);
  if (idx < 0) return;
  const newIdx = idx + delta;
  if (newIdx < 0 || newIdx >= state.doc.length) return;
  const [it] = state.doc.splice(idx, 1);
  state.doc.splice(newIdx, 0, it);
  renderDoc();
  save();
  focusItem(itemId);
}

function moveDocItems(ids, targetIdx) {
  const idSet = new Set(ids);
  const moving = state.doc.filter(x => idSet.has(x.id));
  if (moving.length === 0) return;
  const removedBefore = state.doc.slice(0, targetIdx).filter(x => idSet.has(x.id)).length;
  const adjusted = targetIdx - removedBefore;
  state.doc = state.doc.filter(x => !idSet.has(x.id));
  state.doc.splice(adjusted, 0, ...moving);
  renderDoc();
  save();
}

// Move all selected items up or down by 1 (clamped)
function moveSelectionBy(delta) {
  if (selectedItemIds.size === 0) return;
  const ids = state.doc.filter(x => selectedItemIds.has(x.id)).map(x => x.id);
  if (delta < 0) {
    // Walk from top
    for (let i = 0; i < state.doc.length; i++) {
      if (selectedItemIds.has(state.doc[i].id) && i > 0 && !selectedItemIds.has(state.doc[i - 1].id)) {
        const tmp = state.doc[i - 1]; state.doc[i - 1] = state.doc[i]; state.doc[i] = tmp;
      }
    }
  } else {
    for (let i = state.doc.length - 1; i >= 0; i--) {
      if (selectedItemIds.has(state.doc[i].id) && i < state.doc.length - 1 && !selectedItemIds.has(state.doc[i + 1].id)) {
        const tmp = state.doc[i + 1]; state.doc[i + 1] = state.doc[i]; state.doc[i] = tmp;
      }
    }
  }
  renderDoc();
  save();
}

// ============================================================
// Multi-select
// ============================================================
// selectedItemIds declared at top of script (used by renderDocItem)
let lastSelectedId = null;
const toolbar = document.getElementById("selection-toolbar");
const selCountEl = document.getElementById("sel-count");

function handleSelectionClick(itemId, e) {
  if (e.shiftKey && lastSelectedId) {
    const a = state.doc.findIndex(x => x.id === lastSelectedId);
    const b = state.doc.findIndex(x => x.id === itemId);
    if (a >= 0 && b >= 0) {
      const [lo, hi] = a < b ? [a, b] : [b, a];
      for (let i = lo; i <= hi; i++) selectedItemIds.add(state.doc[i].id);
    }
  } else if (e.ctrlKey || e.metaKey) {
    if (selectedItemIds.has(itemId)) selectedItemIds.delete(itemId);
    else selectedItemIds.add(itemId);
    lastSelectedId = itemId;
  } else {
    // Plain click: toggle, but if multiple selected, make this the only one
    if (selectedItemIds.size === 1 && selectedItemIds.has(itemId)) {
      selectedItemIds.delete(itemId);
    } else {
      selectedItemIds.clear();
      selectedItemIds.add(itemId);
    }
    lastSelectedId = itemId;
  }
  refreshSelectionUI();
}

function refreshSelectionUI() {
  docItemsEl.querySelectorAll(".doc-item").forEach(el => {
    el.classList.toggle("selected", selectedItemIds.has(el.dataset.id));
  });
  if (selectedItemIds.size > 0) {
    toolbar.hidden = false;
    selCountEl.textContent = selectedItemIds.size + " 선택됨";
  } else {
    toolbar.hidden = true;
  }
}

function clearSelection() {
  selectedItemIds.clear();
  lastSelectedId = null;
  refreshSelectionUI();
}

function deleteSelection() {
  if (selectedItemIds.size === 0) return;
  state.doc = state.doc.filter(x => !selectedItemIds.has(x.id));
  if (state.doc.length === 0) state.doc.push({ id: uid(), kind: "para", text: "" });
  selectedItemIds.clear();
  lastSelectedId = null;
  renderDoc();
  refreshSelectionUI();
  save();
}

document.getElementById("sel-up").addEventListener("click", () => moveSelectionBy(-1));
document.getElementById("sel-down").addEventListener("click", () => moveSelectionBy(1));
document.getElementById("sel-delete").addEventListener("click", deleteSelection);
document.getElementById("sel-clear").addEventListener("click", clearSelection);

// Esc clears selection (when not editing); Delete/Backspace deletes when selection present and not focused on contenteditable
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (slashMenuEl && !slashMenuEl.hidden) { closeSlashMenu(); return; }
    if (selectedItemIds.size > 0) { clearSelection(); }
    return;
  }
  if (selectedItemIds.size > 0 && (e.key === "Delete" || e.key === "Backspace")) {
    // Only if focus is not in an editable element (avoid eating backspace in para text)
    const ae = document.activeElement;
    const inEditable = ae && (ae.isContentEditable || ae.tagName === "INPUT" || ae.tagName === "TEXTAREA");
    if (!inEditable) {
      e.preventDefault();
      deleteSelection();
    }
  }
  if (selectedItemIds.size > 0 && e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
    const ae = document.activeElement;
    const inEditable = ae && ae.isContentEditable;
    if (!inEditable) {
      e.preventDefault();
      moveSelectionBy(e.key === "ArrowUp" ? -1 : 1);
    }
  }
});

// Click on canvas blank area: clear selection, otherwise act like docx — create/focus a para.
canvasPane.addEventListener("click", (e) => {
  if (e.target.closest(".doc-item")) return;
  if (e.target.closest("#selection-toolbar")) return;
  if (e.target.closest("#canvas-title")) return;
  if (selectedItemIds.size > 0) { clearSelection(); return; }
  if (document.body.classList.contains("preview-mode")) return;
  // If the last item is already an empty para, just focus it.
  const last = state.doc[state.doc.length - 1];
  if (last && last.kind === "para" && !(last.text || "").trim()) {
    focusItem(last.id, "end");
    return;
  }
  const newItem = { id: uid(), kind: "para", text: "" };
  state.doc.push(newItem);
  renderDoc();
  save();
  focusItem(newItem.id);
});

// ============================================================
// Preview mode toggle
// ============================================================
const btnPreview = document.getElementById("btn-preview");
btnPreview.addEventListener("click", () => {
  const on = !document.body.classList.contains("preview-mode");
  document.body.classList.toggle("preview-mode", on);
  btnPreview.textContent = on ? "편집 모드" : "보기 모드";
  btnPreview.style.background = on ? "#0ea5e9" : "";
  btnPreview.style.borderColor = on ? "#0ea5e9" : "";
  // In preview mode, also lock contenteditable to prevent accidental edits.
  document.querySelectorAll("[contenteditable]").forEach(el => {
    if (on) {
      el.dataset.prevCe = el.contentEditable;
      el.contentEditable = "false";
    } else if (el.dataset.prevCe) {
      el.contentEditable = el.dataset.prevCe;
      delete el.dataset.prevCe;
    }
  });
  if (on && selectedItemIds.size > 0) clearSelection();
});

// ============================================================
// Slash command menu
// ============================================================
const slashMenuEl = document.getElementById("slash-menu");
let slashTarget = null;
let slashActiveIdx = 0;
let slashItems = [];
let slashMode = "main"; // "main" | "card"

function maybeOpenSlashMenu(item, el) {
  const text = (item.text || "");
  // Trigger when text starts with / and has no whitespace after
  if (/^\/[^\s]*$/.test(text)) {
    openSlashMenu(item, el);
  } else {
    closeSlashMenu();
  }
}

function openSlashMenu(item, el) {
  slashTarget = { item, el };
  slashMode = "main";
  renderSlashMenu();
  positionSlashMenu(el);
  slashMenuEl.hidden = false;
}

function closeSlashMenu() {
  slashMenuEl.hidden = true;
  slashTarget = null;
  slashItems = [];
  slashActiveIdx = 0;
}

function positionSlashMenu(el) {
  const r = el.getBoundingClientRect();
  // Place below the para; clamp to viewport
  let top = r.bottom + 4;
  let left = r.left;
  slashMenuEl.style.top = top + "px";
  slashMenuEl.style.left = left + "px";
  // After paint, clamp horizontally
  requestAnimationFrame(() => {
    const mr = slashMenuEl.getBoundingClientRect();
    if (mr.right > window.innerWidth - 8) {
      slashMenuEl.style.left = (window.innerWidth - mr.width - 8) + "px";
    }
    if (mr.bottom > window.innerHeight - 8) {
      slashMenuEl.style.top = (r.top - mr.height - 4) + "px";
    }
  });
}

function renderSlashMenu() {
  if (slashMode === "main") {
    const q = (slashTarget.item.text || "").slice(1).toLowerCase();
    const all = [
      { key: "section",  label: "섹션 헤더", hint: "## 큰 섹션 구분", keys: ["section", "섹션", "헤더"] },
      { key: "quote",    label: "인용",     hint: "> 강조 텍스트",   keys: ["quote", "인용"] },
      { key: "divider",  label: "구분선",   hint: "── 가로선",      keys: ["divider", "구분선", "hr"] },
      { key: "card",     label: "스크래치 카드…", hint: "기존 블럭 삽입 (다음 화면에서 선택)", keys: ["card", "카드", "block"] },
    ];
    slashItems = q
      ? all.filter(o => o.keys.some(k => k.toLowerCase().includes(q)) || o.label.toLowerCase().includes(q))
      : all;
    slashMenuEl.innerHTML = slashItems.length
      ? slashItems.map((o, i) => `
          <div class="slash-item ${i === 0 ? "active" : ""}" data-key="${o.key}" data-idx="${i}">
            <div class="slash-label">${escapeHtml(o.label)}</div>
            <div class="slash-hint">${escapeHtml(o.hint)}</div>
          </div>`).join("")
      : `<div class="slash-empty">매칭 없음</div>`;
    slashActiveIdx = 0;
  } else if (slashMode === "card") {
    const blocks = state.blocks;
    slashItems = blocks.map(b => ({ key: "_card_" + b.id, blockId: b.id, label: b.title || "(제목 없음)", hint: b.type === "guideline" ? "GUIDELINE" : "PROPOSITION" }));
    slashMenuEl.innerHTML = `<div class="slash-section-head">스크래치에서 선택 (Esc로 취소)</div>` + (
      slashItems.length
        ? slashItems.map((o, i) => `
            <div class="slash-item ${i === 0 ? "active" : ""}" data-key="${o.key}" data-idx="${i}">
              <div class="slash-label">${escapeHtml(o.label)}</div>
              <div class="slash-hint">${escapeHtml(o.hint)}</div>
            </div>`).join("")
        : `<div class="slash-empty">스크래치에 블럭 없음</div>`
    );
    slashActiveIdx = 0;
  }
  slashMenuEl.querySelectorAll(".slash-item").forEach(el => {
    el.addEventListener("mousedown", (e) => {
      e.preventDefault();
      slashActiveIdx = parseInt(el.dataset.idx, 10) || 0;
      chooseSlashActive();
    });
    el.addEventListener("mouseenter", () => {
      slashActiveIdx = parseInt(el.dataset.idx, 10) || 0;
      highlightSlashActive();
    });
  });
}

function moveSlashSel(delta) {
  if (slashItems.length === 0) return;
  slashActiveIdx = (slashActiveIdx + delta + slashItems.length) % slashItems.length;
  highlightSlashActive();
}

function highlightSlashActive() {
  slashMenuEl.querySelectorAll(".slash-item").forEach((el, i) => {
    el.classList.toggle("active", i === slashActiveIdx);
  });
}

function chooseSlashActive() {
  if (!slashTarget || slashItems.length === 0) return;
  const choice = slashItems[slashActiveIdx];
  const { item } = slashTarget;
  if (slashMode === "main") {
    if (choice.key === "card") {
      // Clear the "/..." text from the para before switching to card picker
      item.text = "";
      slashTarget.el.textContent = "";
      slashMode = "card";
      renderSlashMenu();
      positionSlashMenu(slashTarget.el);
      save();
      return;
    }
    convertParaToKind(item, choice.key);
    closeSlashMenu();
  } else if (slashMode === "card") {
    const idx = state.doc.findIndex(x => x.id === item.id);
    // Replace current empty para with the inserted block(s)
    state.doc.splice(idx, 1);
    closeSlashMenu();
    insertBlockAt(choice.blockId, idx);
  }
}

function convertParaToKind(item, kind) {
  const idx = state.doc.findIndex(x => x.id === item.id);
  if (idx < 0) return;
  const replacement = { id: item.id };
  if (kind === "section")  { replacement.kind = "section"; replacement.text = ""; }
  else if (kind === "quote")    { replacement.kind = "quote";   replacement.text = ""; }
  else if (kind === "divider")  { replacement.kind = "divider"; }
  state.doc[idx] = replacement;
  // If divider, append a fresh para after so the user can keep typing
  if (kind === "divider") {
    const next = { id: uid(), kind: "para", text: "" };
    state.doc.splice(idx + 1, 0, next);
    renderDoc();
    save();
    focusItem(next.id);
  } else {
    renderDoc();
    save();
    focusItem(replacement.id);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Close slash menu when clicking elsewhere
document.addEventListener("mousedown", (e) => {
  if (slashMenuEl && !slashMenuEl.hidden) {
    if (!slashMenuEl.contains(e.target) && !(slashTarget && slashTarget.el.contains(e.target))) {
      closeSlashMenu();
    }
  }
});

const docCurrentBtn   = document.getElementById("doc-current-btn");

function renderDocSelector() {
  const doc = documents.find(d => d.id === currentDocId);
  docCurrentTitle.textContent = doc ? (doc.title || "(제목 없음)") : "(글 없음)";
  docCurrentBtn.title = doc ? (doc.title || "(제목 없음)") : "글이 없습니다";

function renderDocMenu() {
  docMenuEl.innerHTML = "";
  documents.forEach(d => {
    const row = document.createElement("div");
    row.className = "doc-item-row" + (d.id === currentDocId ? " current" : "");
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = d.title || "(제목 없음)";
    const id = document.createElement("div");
    id.className = "meta-id";
    id.textContent = d.id.slice(0, 6);

    actions.className = "actions";
