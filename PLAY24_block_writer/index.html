    renameBtn.textContent = "이름";
    renameBtn.title = "이름 변경";
    renameBtn.addEventListener("click", (ev) => { ev.stopPropagation(); renameDocPrompt(d.id, d.title); });
    const delBtn = document.createElement("button");
    delBtn.className = "danger";
    delBtn.textContent = "삭제";
    delBtn.title = "글 삭제";
    delBtn.addEventListener("click", (ev) => { ev.stopPropagation(); deleteDocConfirm(d.id, d.title); });
    actions.appendChild(renameBtn);
    actions.appendChild(delBtn);
    row.appendChild(title);
    row.appendChild(id);
    row.appendChild(actions);
    row.addEventListener("click", () => switchToDoc(d.id));
    docMenuEl.appendChild(row);
  });
  const divider = document.createElement("div");
  divider.className = "divider";
  docMenuEl.appendChild(divider);
  const newBtn = document.createElement("button");
  newBtn.className = "new-doc-btn";
  newBtn.textContent = "+ 새 글";
  newBtn.addEventListener("click", () => createNewDoc());

function openDocMenu() {
  renderDocMenu();
  docMenuEl.hidden = false;
}
function closeDocMenu() {
  docMenuEl.hidden = true;
}
docCurrentBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  if (docMenuEl.hidden) openDocMenu(); else closeDocMenu();
});
document.addEventListener("mousedown", (e) => {
  if (!docMenuEl.hidden && !docMenuEl.contains(e.target) && !docCurrentBtn.contains(e.target)) {
    closeDocMenu();
  }
});

async function switchToDoc(docId) {
  if (docId === currentDocId) { closeDocMenu(); return; }
  // Flush any pending save to the OLD doc before switching.
  if (saveTimer) {
    clearTimeout(saveTimer); saveTimer = null;
    snapshotNow();
    await flushSave();
  }
  closeDocMenu();
  try {
    const r = await fetch("/api/current", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: docId }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    currentDocId = docId;
    await load();
    if (hydrateLegacyRefs()) await pushStateToServer();
    hydrate();
    historyStack = [JSON.stringify(state)];
    redoStack = [];
    selectedItemIds.clear();
    refreshSelectionUI();
    renderDocSelector();
    flashStatus("글 전환됨");
  } catch (e) {
    alert("전환 실패: " + e.message);
  }
}

async function createNewDoc() {
  const title = (prompt("새 글 제목 (비워두면 나중에 H1에서 편집):", "") || "").trim();
  closeDocMenu();
  try {
    const r = await fetch("/api/documents", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    // Refresh list and switch to the new doc.
    await fetchDocuments();
    await switchToDoc(data.id);
  } catch (e) {
    alert("생성 실패: " + e.message);
  }
}

async function renameDocPrompt(docId, currentTitle) {
  const next = prompt("새 제목:", currentTitle || "");
  if (next === null) return;
  try {
    const r = await fetch(`/api/documents/${encodeURIComponent(docId)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: next }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const doc = documents.find(d => d.id === docId);
    if (doc) doc.title = next;
    if (docId === currentDocId) {
      state.title = next;
      titleEl.textContent = next;
    }
    renderDocSelector();
    renderDocMenu();
    flashStatus("이름 바뀜");
  } catch (e) {
    alert("이름변경 실패: " + e.message);
  }
}

async function deleteDocConfirm(docId, title) {
  if (!confirm(`정말 삭제할까요?\n\n"${title || "(제목 없음)"}"\n\n이 글의 블럭과 캔버스 내용이 모두 사라집니다.`)) return;
  try {
    const r = await fetch(`/api/documents/${encodeURIComponent(docId)}`, { method: "DELETE" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    closeDocMenu();
    // Refresh documents and load whatever the server made current.
    await fetchDocuments();
    if (currentDocId !== data.currentId) currentDocId = data.currentId;
    await load();
    if (hydrateLegacyRefs()) await pushStateToServer();
    hydrate();
    historyStack = [JSON.stringify(state)];
    redoStack = [];
    selectedItemIds.clear();
    refreshSelectionUI();
    renderDocSelector();
    flashStatus("삭제됨");
  } catch (e) {
    alert("삭제 실패: " + e.message);
  }
}

// ============================================================
// Diagnostic panel
// ============================================================
const diagFab   = document.getElementById("diagnostic-fab");
const diagPanel = document.getElementById("diagnostic-panel");
const diagBody  = document.getElementById("diag-body");
const diagBadge = document.getElementById("diag-badge");

function computeDiagnostic() {
  const props = state.blocks.filter(b => b.type === "proposition");
  const guides = state.blocks.filter(b => b.type === "guideline");
  const roleCounts = {};
  ROLES.forEach(r => roleCounts[r.key] = 0);
  let untagged = 0;
  let propsMissingSource = 0;
  for (const b of state.blocks) {
    if (b.role && roleCounts.hasOwnProperty(b.role)) roleCounts[b.role]++;
    else untagged++;
  }
  for (const p of props) {
    if (!(p.source || "").trim()) propsMissingSource++;
  }
  const emptyGuidelines = guides.filter(g => !state.blocks.some(b => b.parentId === g.id));

  // Doc-level stats
  const titleLen = (state.title || "").length;
  let canvasChars = 0;
  let canvasPara = 0;
  let canvasCards = 0;
  let canvasSections = 0;
  for (const it of state.doc) {
    if (it.kind === "para") { canvasChars += (it.text || "").length; canvasPara++; }
    else if (it.kind === "card") { canvasChars += (it.title || "").length + (it.body || "").length; canvasCards++; }
    else if (it.kind === "section") { canvasChars += (it.text || "").length; canvasSections++; }
    else if (it.kind === "text" || it.kind === "quote") { canvasChars += (it.text || "").length; }
  }
  const readMinutes = Math.max(1, Math.round(canvasChars / 500)); // ~500 chars/min Korean reading

  // Warnings
  const warns = [];
  if (props.length > 0 && roleCounts.claim === 0) {
    warns.push({ level: "error", msg: "주장(claim) 블럭이 0개. 글의 결정적 한 줄을 명제로 명시하세요." });
  }
  if (roleCounts.claim > 0 && roleCounts.evidence < roleCounts.claim) {
    warns.push({ level: "warn", msg: `주장 ${roleCounts.claim}개 vs 근거 ${roleCounts.evidence}개 — 근거가 부족.` });
  }
  if (props.length >= 5 && roleCounts.counter === 0) {
    warns.push({ level: "warn", msg: "반박(counter) 블럭 0개. 가장 강한 반대 논리를 1개라도 인정해야 변호사급 글." });
  }
  if (props.length >= 4 && propsMissingSource >= Math.ceil(props.length / 2)) {
    warns.push({ level: "warn", msg: `명제 ${props.length}개 중 ${propsMissingSource}개가 출처 비어있음 — 맨주장 위험.` });
  }
  if (emptyGuidelines.length > 0) {
    warns.push({ level: "info", msg: `빈 가이드라인 ${emptyGuidelines.length}개 — 채우거나 삭제.` });
  }
  if (untagged > 0 && state.blocks.length > 0) {
    warns.push({ level: "info", msg: `역할이 안 잡힌 블럭 ${untagged}개. 명확한 글은 모든 블럭의 역할이 의식적임.` });
  }
  if (canvasCards > 0 && roleCounts.emotion === 0 && roleCounts.example === 0) {
    warns.push({ level: "info", msg: "감성·사례 블럭 0개. 논리만으로는 공감이 어렵습니다." });
  }
  if (canvasChars > 0 && canvasChars < 400) {
    warns.push({ level: "info", msg: `본문 ${canvasChars}자 — 아직 골격 단계. 단락 채워 보세요.` });
  }

  return { roleCounts, untagged, propsMissingSource, emptyGuidelines, props, guides, titleLen,
           canvasChars, canvasPara, canvasCards, canvasSections, readMinutes, warns };
}

function renderDiagnostic() {
  const d = computeDiagnostic();
  diagBody.innerHTML = "";

  // Stats overview
  const h1 = document.createElement("div"); h1.className = "section-h"; h1.textContent = "개요";
  diagBody.appendChild(h1);
  const stats = [
    ["가이드라인", d.guides.length],
    ["명제",       d.props.length],
    ["빈 가이드라인", d.emptyGuidelines.length],
    ["본문 글자수", d.canvasChars],
    ["단락",        d.canvasPara],
    ["섹션",        d.canvasSections],
    ["박힌 카드",   d.canvasCards],
    ["예상 읽기",   d.readMinutes + "분"],
  ];
  for (const [k, v] of stats) {
    const row = document.createElement("div"); row.className = "stat-row";
    const a = document.createElement("span"); a.textContent = k; a.style.color = "#78716c";
    const b = document.createElement("span"); b.textContent = v; b.style.fontWeight = "600";
    row.appendChild(a); row.appendChild(b); diagBody.appendChild(row);
  }

  // Role distribution
  const h2 = document.createElement("div"); h2.className = "section-h"; h2.textContent = "역할 분포";
  diagBody.appendChild(h2);
  const totalRoled = ROLES.reduce((s, r) => s + d.roleCounts[r.key], 0) + d.untagged;
  if (totalRoled === 0) {
    const n = document.createElement("div"); n.className = "nothing"; n.textContent = "(블럭 없음)";
    diagBody.appendChild(n);
  } else {
    for (const r of ROLES) {
      const c = d.roleCounts[r.key];
      if (c === 0) continue;
      const row = document.createElement("div"); row.className = "role-bar";
      const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = r.color;
      const lbl = document.createElement("span"); lbl.className = "label"; lbl.textContent = r.ko;
      const cnt = document.createElement("span"); cnt.className = "count"; cnt.textContent = c;
      row.appendChild(dot); row.appendChild(lbl); row.appendChild(cnt);
      diagBody.appendChild(row);
    }
    if (d.untagged > 0) {
      const row = document.createElement("div"); row.className = "role-bar";
      const dot = document.createElement("span"); dot.className = "dot";
      dot.style.background = "transparent"; dot.style.border = "1px dashed #a8a29e";
      const lbl = document.createElement("span"); lbl.className = "label";
      lbl.textContent = "(역할 미설정)"; lbl.style.color = "#a8a29e";
      const cnt = document.createElement("span"); cnt.className = "count"; cnt.textContent = d.untagged;
      row.appendChild(dot); row.appendChild(lbl); row.appendChild(cnt);
      diagBody.appendChild(row);
    }
  }

  // Warnings
  const h3 = document.createElement("div"); h3.className = "section-h"; h3.textContent = "약점 진단";
  diagBody.appendChild(h3);
  if (d.warns.length === 0) {
    const n = document.createElement("div"); n.className = "nothing"; n.textContent = "(현재 약점 없음 — 좋습니다)";
    diagBody.appendChild(n);
  } else {
    for (const w of d.warns) {
      const div = document.createElement("div"); div.className = "warn " + (w.level || "");
      div.textContent = w.msg;
      diagBody.appendChild(div);
    }
  }

  // Badge on FAB shows error+warn count
  const seriousCount = d.warns.filter(w => w.level === "error" || w.level === "warn").length;
  if (seriousCount > 0) { diagBadge.hidden = false; diagBadge.textContent = seriousCount; }
  else { diagBadge.hidden = true; }
}

let _diagTimer = null;
function scheduleDiagnostic() {
  clearTimeout(_diagTimer);
  _diagTimer = setTimeout(renderDiagnostic, 250);
}

diagFab.addEventListener("click", () => {
  if (diagPanel.hidden) { renderDiagnostic(); diagPanel.hidden = false; }
  else { diagPanel.hidden = true; }
});
document.getElementById("diag-close").addEventListener("click", () => { diagPanel.hidden = true; });
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "/") {
    e.preventDefault();
    diagFab.click();
  }
});

// Recompute diagnostic when state changes (piggyback on save)
const _origSave = save;
save = function(...args) {
  _origSave.apply(this, args);
  scheduleDiagnostic();
};
// Also after hydrate
const _origHydrate = hydrate;
hydrate = function(...args) {
  _origHydrate.apply(this, args);
  scheduleDiagnostic();
};

// ============================================================
// Snippet menu (transition phrases)
// ============================================================
const snippetMenuEl = document.getElementById("snippet-menu");
let snippetTargetEl = null;  // contenteditable element to insert into

function openSnippetMenu(triggerEl, paraEl) {
  snippetTargetEl = paraEl;
  snippetMenuEl.innerHTML = "";
  const byCat = {};
  for (const s of SNIPPETS) {
    if (!byCat[s.cat]) byCat[s.cat] = [];
    byCat[s.cat].push(s);
  }
  for (const cat of Object.keys(byCat)) {
    const h = document.createElement("div");
    h.className = "snippet-cat";
    h.textContent = cat;
    snippetMenuEl.appendChild(h);
    for (const s of byCat[cat]) {
      const row = document.createElement("div");
      row.className = "snippet-row";
      row.textContent = s.text;
      row.addEventListener("mousedown", (e) => { e.preventDefault(); insertSnippet(s.text); });
      snippetMenuEl.appendChild(row);
    }
  }
  const rect = triggerEl.getBoundingClientRect();
  snippetMenuEl.style.left = (rect.right + 6) + "px";
  snippetMenuEl.style.top  = rect.top + "px";
  snippetMenuEl.hidden = false;
  requestAnimationFrame(() => {
    const r = snippetMenuEl.getBoundingClientRect();
    if (r.right > window.innerWidth - 8) snippetMenuEl.style.left = (window.innerWidth - r.width - 8) + "px";
    if (r.bottom > window.innerHeight - 8) snippetMenuEl.style.top = (window.innerHeight - r.height - 8) + "px";
  });
}
function closeSnippetMenu() { snippetMenuEl.hidden = true; snippetTargetEl = null; }
function insertSnippet(text) {
  if (!snippetTargetEl) return;
  snippetTargetEl.focus();
  document.execCommand("insertText", false, text);
  // Trigger input handler so state.text gets updated
  snippetTargetEl.dispatchEvent(new Event("input", { bubbles: true }));
  closeSnippetMenu();
}
document.addEventListener("mousedown", (e) => {
  if (!snippetMenuEl.hidden && !snippetMenuEl.contains(e.target) && !e.target.classList.contains("snippet-trigger")) {
    closeSnippetMenu();
  }
});

// Attach snippet trigger to every editable doc item (para/text/quote/section).
// We hook into renderDoc via a post-render pass.
const _origRenderDoc = renderDoc;
renderDoc = function(...args) {
  _origRenderDoc.apply(this, args);
  decorateDocItemsWithSnippetTriggers();
};
function decorateDocItemsWithSnippetTriggers() {
  const items = docItemsEl.querySelectorAll(".doc-item");
  items.forEach(wrap => {
    const editable = wrap.querySelector('[contenteditable="true"]');
    if (!editable) return;
    if (wrap.querySelector(".snippet-trigger")) return;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "snippet-trigger";
    btn.textContent = "✏︎";
    btn.title = "전환 표현 라이브러리";
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      openSnippetMenu(btn, editable);
    });
    wrap.appendChild(btn);
  });
}

// ============================================================
// Templates — hook into createNewDoc
// ============================================================
async function createNewDocWithTemplate() {
  const choice = prompt(
    "새 글:\n\n" +
    "1 = 분석 리포트 (시나리오 보고서 골격)\n" +
    "2 = 오피니언 칼럼\n" +
    "3 = 개인 에세이\n" +
    "(엔터 = 빈 글)\n\n제목 (옵션): 1, 2, 3 중 하나 또는 빈 칸",
    ""
  );
  if (choice === null) return null;
  const ch = (choice || "").trim();
  let title = "";
  let tpl = null;
  if (ch === "1") tpl = TEMPLATES.analysis;
  else if (ch === "2") tpl = TEMPLATES.opinion;
  else if (ch === "3") tpl = TEMPLATES.essay;
  else title = ch;  // free-text title, no template
  if (tpl) title = prompt(`"${tpl.name}" 글의 제목:`, "") || "";

  closeDocMenu();
  try {
    const r = await fetch("/api/documents", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    await fetchDocuments();
    await switchToDoc(data.id);
    // If a template was chosen, seed the new doc with its guidelines via PUT.
    if (tpl) {
      const seedBlocks = tpl.blocks.map((b, i) => ({
        id: uid() + "_" + i,
        type: b.type,
        title: b.title || "",
        body: b.body || "",
        role: b.role || undefined,
      }));
      state = { title, blocks: seedBlocks, doc: [{ id: uid(), kind: "para", text: "" }] };
      await pushStateToServer();
      hydrate();
      historyStack = [JSON.stringify(state)];
    }
    flashStatus(tpl ? `${tpl.name} 템플릿 적용` : "새 글 생성");
    return data.id;
  } catch (e) {
    alert("생성 실패: " + e.message);
    return null;
  }
}
// Override the simple createNewDoc with the template-aware one.
createNewDoc = createNewDocWithTemplate;

      { rule: "답 없는 질문도 가치 있음 — 정직이 우선", detail: "모르겠으면 모른다고 정직하게. 억지 답이 글을 망친다." },
    ],
    "감성": [
      { rule: "감정 이름 부르지 말고 *상황*을 보여라", detail: "Show, don't tell. 슬픔 → 떠난 자리의 컵." },
    ],
    "비유": [
      { rule: "비유는 *독자가 아는 것 → 모르는 것* 방향", detail: "모르는 것으로 모르는 것 비유하면 망한다. 일상에서 시작." },
      { rule: "비유는 1~2문장으로 끝내고 본문으로 돌아와라", detail: "비유가 길어지면 글이 *비유에 잡아먹힘*." },
      { rule: "비유가 *주장과 정확히 일치*하는지 검증", detail: "비유는 매력적이라 검증 없이 통과되기 쉽다. 한 번 더 확인." },
    ],
    "행동": [
      { rule: "행동은 *구체적*이어야 한다", detail: "\"X 하라\"의 형태. \"더 사랑하자\" 같은 추상 금지." },
    ],
    "촉구": [
      { rule: "촉구는 *오늘부터 가능한* 행동으로", detail: "거대한 사회 변화 촉구는 무력. 한 사람이 한 번에 할 수 있는 것." },
    ],
    "도입": [
      { rule: "도입의 임무 = 독자를 *멈추게* 하기", detail: "익숙한 통념의 균열, 의외의 사실, 강한 질문. 셋 중 하나." },
    ],
    "서론": [
      { rule: "서론은 *글의 약속*을 명시", detail: "이 글이 무엇을 다룰지, 무엇을 다루지 않을지. 모호함이 가장 위험." },
    ],
  },

  general: [
    { rule: "한 단락 = 한 주장", detail: "두 주장이 들어가면 단락을 쪼개라. 단락 안에서 길을 잃으면 독자도 잃는다." },
    { rule: "추상 명사 + 약한 동사 패턴을 피해라", detail: "\"감사의 마음을 느꼈다\" → \"감사했다\". 추상명사 사슬은 글을 흐리게 한다." },
    { rule: "형용사·부사 줄이고 동사·명사 늘려라", detail: "강한 글은 명사·동사로, 약한 글은 형용사·부사로 만들어진다. 다듬을 때 형용사부터 도려내라." },
    { rule: "마지막 문장이 다음 단락 첫 문장을 *예고*하게", detail: "단락 사이가 끊기지 않게 연결. 흐름이 부드러우면 독자가 안 멈춘다." },
    { rule: "처음 쓸 때는 길게, 다듬을 때는 짧게", detail: "초고는 토하듯이, 퇴고는 도려내듯이. *짧아질수록 좋다*." },
    { rule: "첫 줄과 마지막 줄이 *호응*하는가", detail: "처음과 끝이 같은 메시지를 가리키면 글이 단단. 다르면 길을 잃은 것." },
    { rule: "두 시간 뒤 다시 읽어도 *멈칫* 없이 흐르는가", detail: "다듬은 직후엔 다 좋아 보인다. 시간 두고 다시 읽으면 약점이 드러남." },
    { rule: "한 글 = 한 핵심 주장", detail: "둘 이상 있으면 두 글로 쪼개라. 한 글에 두 주장이 들어가면 둘 다 약해짐." },
    { rule: "*가장 약한 문단*을 찾아 도려내라", detail: "글에는 *없으면 더 강해질* 부분이 반드시 있다. 그 부분이 가장 약한 문단." },
    { rule: "너가 *지루하다*고 느끼면 독자는 더 지루하다", detail: "스스로 읽다 지루한 부분은 도려내거나 압축하라. 자비 없이." },
    { rule: "*결정적 한 줄*을 의식적으로 만들어 박아라", detail: "글에는 *기억되는 한 줄*이 있어야 한다. 평탄하기만 하면 잊혀진다." },
    { rule: "같은 단어를 한 단락에 두 번 이상 쓰지 마라", detail: "유의어로 바꾸거나 문장 구조를 바꿔라. 반복은 게으름의 신호." },
    { rule: "접속사를 자주 쓰는 글은 *논리가 엉성*하다", detail: "\"그리고, 그러나, 또한\"이 많으면 문장 사이 관계가 명확하지 않다는 신호." },
    { rule: "글을 *소리 내어 읽어보라*", detail: "발음이 어려운 곳은 문장이 어려운 곳. 호흡이 끊기는 곳은 문장 구조가 잘못된 곳." },
    { rule: "*독자가 누구인지* 한 명을 떠올려라", detail: "막연한 \"독자들\"이 아니라 *구체적 한 사람*. 그 사람한테 말하듯 써라." },
  ],
};

// Build keyword regex for fast matching (sort by length desc so longer matches win)
const KEYWORD_KEYS = Object.keys(TIPS.byKeyword).sort((a, b) => b.length - a.length);

const tipFab   = document.getElementById("tip-fab");
const tipPanel = document.getElementById("tip-panel");
const tipBody  = document.getElementById("tip-body");

let currentFocusedBlockId   = null;
let currentFocusedDocItemId = null;

function getCurrentContext() {
  // Returns { role, sources: [{label, text}], roleLabel }
  let role = null;
  let roleLabel = null;
  const sources = [];

  if (currentFocusedBlockId) {
    const b = state.blocks.find(x => x.id === currentFocusedBlockId);
    if (b) {
      role = b.role || null;
      if (role && ROLE_BY_KEY[role]) roleLabel = ROLE_BY_KEY[role].ko;
      sources.push({ label: "블럭 제목", text: b.title || "" });
      sources.push({ label: "블럭 본문", text: b.body || "" });
      if (b.parentId) {
        const parent = state.blocks.find(x => x.id === b.parentId);
        if (parent) sources.push({ label: "상위 가이드라인", text: parent.title || "" });
      }
    }
  } else if (currentFocusedDocItemId) {
    const it = state.doc.find(x => x.id === currentFocusedDocItemId);
    if (it) {
      if (it.kind === "card") {
        // role from source block (if still exists), else from blockType heuristic
        if (it.blockId) {
          const src = state.blocks.find(b => b.id === it.blockId);
          if (src) {
            role = src.role || null;
            if (role && ROLE_BY_KEY[role]) roleLabel = ROLE_BY_KEY[role].ko;
          }
        }
        sources.push({ label: "카드 제목", text: it.title || "" });
        sources.push({ label: "카드 본문", text: it.body || "" });
      } else if (it.kind === "section") {
        sources.push({ label: "섹션 제목", text: it.text || "" });
      } else if (it.kind === "para" || it.kind === "quote" || it.kind === "text") {
        sources.push({ label: "단락 본문", text: it.text || "" });
        // Find nearest preceding section for guideline context
        const idx = state.doc.findIndex(x => x.id === it.id);
        for (let i = idx - 1; i >= 0; i--) {
          if (state.doc[i].kind === "section") {
            sources.push({ label: "이 섹션", text: state.doc[i].text || "" });
            break;
          }
        }
      }
    }
  }

  return { role, roleLabel, sources };
}

function detectKeywords(sources) {
  const found = new Set();
  for (const s of sources) {
    const text = s.text || "";
    for (const kw of KEYWORD_KEYS) {
      if (text.includes(kw)) found.add(kw);
    }
  }
  return [...found];
}

function renderTips() {
  if (tipPanel.hidden) return;
  const ctx = getCurrentContext();
  const keywords = detectKeywords(ctx.sources);

  tipBody.innerHTML = "";

  // Context banner
  const contextEl = document.createElement("div");
  contextEl.className = "tip-context" + (ctx.role || keywords.length ? "" : " empty");
  if (ctx.role || keywords.length) {
    const parts = [];
    if (ctx.roleLabel) parts.push(`역할: <b>${ctx.roleLabel}</b>`);
    if (keywords.length) parts.push(`키워드: <b>${keywords.join(", ")}</b>`);
    contextEl.innerHTML = parts.join(" · ");
  } else {
    contextEl.textContent = "블럭이나 단락에 포커스하면 그 역할·키워드에 맞는 팁이 나옴. 지금은 일반 원칙만.";
  }
  tipBody.appendChild(contextEl);

  // Role-based tips
  if (ctx.role && TIPS.byRole[ctx.role]) {
    appendTipCategory(`역할: ${ctx.roleLabel}`, TIPS.byRole[ctx.role], "role", "#0ea5e9");
  }

  // Keyword-based tips
  for (const kw of keywords) {
    if (TIPS.byKeyword[kw]) {
      appendTipCategory(`키워드: ${kw}`, TIPS.byKeyword[kw], "keyword", "#ea580c");
    }
  }

  // General principles always
  appendTipCategory("기본 원칙", TIPS.general, "general", "#94a3b8");
}

function appendTipCategory(headLabel, tips, klass, color) {
  const h = document.createElement("div");
  h.className = "tip-cat-h";
  h.textContent = headLabel;
  h.style.color = color;
  tipBody.appendChild(h);
  for (const t of tips) {
    const wrap = document.createElement("div");
    wrap.className = "tip " + klass;
    if (klass === "role") wrap.style.borderLeftColor = color;
    if (klass === "keyword") wrap.style.borderLeftColor = color;
    const rule = document.createElement("div");
    rule.className = "rule";
    rule.textContent = t.rule;
    wrap.appendChild(rule);
    if (t.detail) {
      const det = document.createElement("div");
      det.className = "detail";
      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "→";
      det.appendChild(arrow);
      det.appendChild(document.createTextNode(t.detail));
      wrap.appendChild(det);
    }
    tipBody.appendChild(wrap);
  }
}

// Focus tracking across canvas + scratch (and titles too)
document.addEventListener("focusin", (e) => {
  const blockEl = e.target.closest(".block");
  const docItemEl = e.target.closest(".doc-item");
  const newBlock = blockEl ? blockEl.dataset.id : null;
  const newDoc = docItemEl ? docItemEl.dataset.id : null;
  if (newBlock !== currentFocusedBlockId || newDoc !== currentFocusedDocItemId) {
    currentFocusedBlockId = newBlock;
    currentFocusedDocItemId = newDoc;
    if (!tipPanel.hidden) renderTips();
  }
});

tipFab.addEventListener("click", () => {
  if (tipPanel.hidden) {
    tipPanel.hidden = false;
    renderTips();
  } else {
    tipPanel.hidden = true;
  }
});
document.getElementById("tip-close").addEventListener("click", () => { tipPanel.hidden = true; });
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === "." || e.key === "Period")) {
    e.preventDefault();
    tipFab.click();
  }
});

</script>
</body>
